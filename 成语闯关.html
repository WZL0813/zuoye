<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>成语闯关 · 高考成语语义 250 题</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f6f8;--card:#fff;--line:#e3e6ea;--txt:#1f2328;--sub:#6b7280;
--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--r:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--txt);line-height:1.65;font-size:16px;
padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;font-weight:600}
h2{font-size:17px;font-weight:600;margin-bottom:10px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);
border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;flex:1;
min-width:118px;text-align:center;transition:.12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.gh{background:transparent}
.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px}
.lv{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--card);
display:flex;flex-direction:column;align-items:center;justify-content:center;
font-size:14px;cursor:pointer}
.lv.done{background:#e8f5ee;border-color:#b7e2c8;color:var(--ok)}
.lv.cur{border-color:var(--pri);border-width:2px;color:var(--pri)}
.lv.lock{opacity:.4;cursor:not-allowed}
.lv small{font-size:10px;color:var(--sub)}
.lv.done small{color:var(--ok)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:.3s}
.stat{display:flex;gap:10px;text-align:center}
.stat div{flex:1;background:var(--bg);border-radius:10px;padding:9px}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--sub)}
.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:500}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#4338ca;border:1px solid #dbe3ff}
.tag.g{background:#e8f5ee;color:#15803d;border-color:#b7e2c8}
.tag.j{background:#fef3e2;color:#b45309;border:1px solid #fde2b8}
.q{font-size:17px;margin:2px 0 12px;line-height:1.8}
.q em{font-style:normal;color:var(--pri);font-weight:600;border-bottom:2px solid #c7d8fe;padding:0 1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.opt{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--card);
cursor:pointer;font-size:17px;display:flex;gap:10px;align-items:center;transition:.12s}
.opt .k{font-weight:600;color:var(--sub);min-width:18px}
.opt.sel{border-color:var(--pri);background:#eff6ff}
.opt.right{border-color:var(--ok);background:#e8f5ee}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.opt.wrong .k{color:var(--bad)}
.opt small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:1px}
.opt.right small{color:var(--ok)}
.opt.wrong small{color:var(--bad)}
.tip{border-radius:11px;padding:11px 13px;font-size:14px;margin-top:10px;line-height:1.7}
.tip.ok{background:#e8f5ee;color:#14663a}
.tip.bad{background:#fdecec;color:#9b1c1c}
.qb{border-bottom:1px solid var(--line);padding:12px 0}
.qb:last-child{border:0}
.wl{border-bottom:1px solid var(--line);padding:10px 0;font-size:15px}
.wl:last-child{border:0}
.wl em{font-style:normal;color:var(--sub);font-size:12px;display:block;margin-top:4px}
.mini{font-size:11px;color:var(--sub);padding:1px 6px;border:1px solid var(--line);border-radius:20px}
/* 判断题大按钮 */
.jopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.jopt{border:2px solid var(--line);border-radius:14px;padding:16px;background:var(--card);
cursor:pointer;text-align:center;font-size:20px;font-weight:600;transition:.12s}
.jopt small{display:block;font-size:13px;color:var(--sub);font-weight:400;margin-top:4px}
.jopt.right{border-color:var(--ok);background:#e8f5ee;color:var(--ok)}
.jopt.wrong{border-color:var(--bad);background:#fdecec;color:var(--bad)}
</style>
</head>

<div class="wrap">
  <div id="s-home"></div>
  <div id="s-level"><div class="sub" id="lvTag" style="margin-bottom:8px"></div><div id="lvBody"></div></div>

  <div id="s-report" class="hide"></div>

</div>
<script type="application/json" id="bank">[{"t":"choice","q":"他在会上发言：“我这点____，说出来不过是供各位参考，算不得什么高见。”","a":"一孔之见","d":["真知灼见","远见卓识","金玉良言"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"一孔之见：从一个小孔里看到的，比喻狭隘片面的见解，是谦辞，用于称自己的见解。句中“算不得什么高见”正合自谦之意。易错点：三个干扰项“真知灼见”（正确透彻的见解）、“远见卓识”（远大的眼光和见识）、“金玉良言”（宝贵的教诲）都是称颂他人言论的敬辞色彩表达，用来称说自己的看法属谦敬错位。"},{"t":"judge","q":"军民同仇敌忾，共同抵御外侮。","a":"√","d":[],"dt":[],"idi":"同仇敌忾","m":"望文生义","n":"✓ 用法正确。“同仇敌忾”指全体一致地抱着对敌人的仇恨和愤怒。句中“共同抵御外侮”正合此义。"},{"t":"judge","q":"他的恶行有口皆碑，人人唾骂。","a":"×","d":[],"dt":[],"idi":"有口皆碑","m":"褒贬误用","n":"✗ 用法有误。“有口皆碑”比喻对突出的好人好事人人称赞，是褒义词。句中用它形容“恶行”，属褒贬误用。"},{"t":"judge","q":"父母对孩子的关怀真是无所不至。","a":"×","d":[],"dt":[],"idi":"无所不至","m":"褒贬误用","n":"✗ 用法有误。“无所不至”指没有达不到的地方，也指什么坏事都干得出来，是贬义词。句中要表达的是“关怀周到”，应用“无微不至”，属褒贬误用。"},{"t":"judge","q":"先生高见，令晚辈茅塞顿开。","a":"√","d":[],"dt":[],"idi":"茅塞顿开","m":"谦敬错位","n":"✓ 用法正确。“茅塞顿开”形容忽然理解、领会，句中用来表达受教后的领悟，正合适。"},{"t":"judge","q":"他对人虚与委蛇，从不真心相待。","a":"√","d":[],"dt":[],"idi":"虚与委蛇","m":"望文生义","n":"✓ 用法正确。“虚与委蛇”指对人虚情假意、敷衍应酬。句中“从不真心相待”正合此义。"},{"t":"judge","q":"他的想象匪夷所思，令人惊叹。","a":"√","d":[],"dt":[],"idi":"匪夷所思","m":"望文生义","n":"✓ 用法正确。“匪夷所思”指事物怪异或人的言行离奇，不是一般人所能想象的。句中“令人惊叹”正合此义。"},{"t":"choice","q":"沿江新建的住宅楼整齐地____，一直延伸到视线的尽头。","a":"鳞次栉比","d":["星罗棋布","参差不齐","七零八落"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"鳞次栉比：像鱼鳞和梳子齿那样一个挨一个地排列着，形容房屋等密集而整齐地排列。句中“整齐地……延伸到尽头”正合此义。易错点：该成语只用于建筑物等密集整齐排列——“星罗棋布”形容数量多、分布广，侧重散布各处而非整齐排列；“参差不齐”“七零八落”都形容不整齐、零散，与“整齐地”直接矛盾。"},{"t":"choice","q":"不法商贩把过期食品____后重新上市，坑害消费者。","a":"改头换面","d":["焕然一新","脱胎换骨","面目一新"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"改头换面：只改变外表和形式，内容实质不变，是贬义词。句中“把过期食品……后重新上市”正是形式改变、实质未变，正合贬义语境。易错点：该成语指“换汤不换药”的假改变——“焕然一新”“脱胎换骨”“面目一新”都指彻底改变、面貌一新（褒义），用于坑害消费者的行径即色彩颠倒。"},{"t":"choice","q":"这本游记对沿途风物的描写____，读完后脑子里什么都没留下。","a":"浮光掠影","d":["走马观花","蜻蜓点水","轻描淡写"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"浮光掠影：水面上的光和掠过的影子，比喻观察不细致、印象不深刻，强调结果。句中“读完后……什么都没留下”正是印象不深，正合此义。易错点：与“走马观花”是经典辨析对——前者强调“结果印象不深”，后者强调“观察过程不细致”，本句落在“读完后”的结果上，故用“浮光掠影”；“轻描淡写”指说话写文章把重要问题轻轻带过。“蜻蜓点水”比喻做事肤浅、不深入，与“观察印象浅”略有不同。"},{"t":"judge","q":"他漠不关心别人的困难。","a":"×","d":[],"dt":[],"idi":"漠不关心","m":"近义误用","n":"✗ 用法有误。“漠不关心”指态度冷淡、毫不关心，后面不能直接带宾语。应说“对别人的困难漠不关心”。句中让它带宾语“别人的困难”，属搭配不当。"},{"t":"judge","q":"面对两种方案，他莫衷一是，迟迟拿不定主意。","a":"×","d":[],"dt":[],"idi":"莫衷一是","m":"望文生义","n":"✗ 用法有误。“莫衷一是”指众人不能得出一致的结论，主语应是“众人”，不能用来形容“一个人拿不定主意”。句中主语是“他”一个人，属对象（主语）误用。"},{"t":"choice","q":"小王站起来说：“陈教授刚才那番话高屋建瓴，我下面讲的只怕是____了。”","a":"狗尾续貂","d":["抛砖引玉","画蛇添足","一孔之见"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"狗尾续貂：比喻拿不好的东西接到好东西后面，显得好坏不相称；多用作谦辞，用于自己在他人之后接着讲或续写。句中“陈教授那番话高屋建瓴，我下面讲的……”正是自谦承接在后，正合此义。易错点：“一孔之见”也是谦辞，但指狭隘片面的见解，与“接续在别人之后”的语境不合；“抛砖引玉”是谦辞，用于自己先发言引出高见，方向是“在先”而非“在后”；“画蛇添足”比喻做了多余的事，是贬义，不含自谦之意。"},{"t":"choice","q":"他在信中称赞对方的新著：“拜读之下，只觉____，受益良多。”","a":"字字珠玑","d":["一孔之见","抛砖引玉","蓬荜生辉"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"字字珠玑：珠玑，珍珠；每个字都像珍珠一样，比喻诗文语言精美，是称颂他人作品的敬辞色彩表达。句中称赞对方的新著，正合此义。易错点：三个干扰项都是谦辞，只能用于称说自己或自己一方——“一孔之见”用于自己的见解，“抛砖引玉”用于自己的发言，“蓬荜生辉”用于自己的居所，用来称颂别人的著作既属谦敬错位，又含贬损之意。"},{"t":"judge","q":"他的大名如雷贯耳，早已闻名。","a":"√","d":[],"dt":[],"idi":"如雷贯耳","m":"望文生义","n":"✓ 用法正确。“如雷贯耳”比喻人的名声很大。句中“早已闻名”正合此义。"},{"t":"judge","q":"这篇文章味同嚼蜡，毫无新意。","a":"√","d":[],"dt":[],"idi":"味同嚼蜡","m":"望文生义","n":"✓ 用法正确。“味同嚼蜡”形容没有味道，多指文章或言语枯燥乏味。句中“毫无新意”正合此义。"},{"t":"judge","q":"他放在抽屉里的钱包不胫而走，找不到了。","a":"×","d":[],"dt":[],"idi":"不胫而走","m":"近义误用","n":"✗ 用法有误。“不胫而走”指消息、言论等不待推行就迅速传播，不能用于“东西丢失”。钱包丢失应用“不翼而飞”，句中误把两者相混。"},{"t":"choice","q":"这家企业为打压竞争对手，____，使尽了卑劣手段。","a":"处心积虑","d":["殚精竭虑","呕心沥血","煞费苦心"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"处心积虑：处心，存心；积虑，长期谋划；指千方百计地盘算，是贬义词。句中“使尽了卑劣手段”表明作者持批判态度，正合贬义语境。易错点：最易与褒义的“殚精竭虑”（用尽精力、费尽心思）混淆，二者结构相近而褒贬相反，是高考最爱考的一对；“呕心沥血”“煞费苦心”也都是褒义或中性，用于“卑劣手段”即成色彩颠倒。"},{"t":"choice","q":"这两家企业业务往来频繁，命运____，早已唇齿相依。","a":"休戚相关","d":["息息相关","唇亡齿寒","休戚与共"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"休戚相关：休，欢乐；戚，忧愁；彼此之间的忧乐祸福互相关联，形容关系密切、利害一致。句中“命运……唇齿相依”正合“祸福共担”之义。易错点：与“息息相关”是经典辨析对——“息息相关”只表示关系密切（可形容一切相关的事物），“休戚相关”专指“人的祸福、利害”相关，本句主语是企业（拟人化的命运共同体），“唇齿相依”也提示“利害与共”，故用“休戚相关”。“唇亡齿寒”“休戚与共”虽也表利害相关，但前者强调“相互依存、一方亡则另一方危”，后者强调“同甘共苦”，都不如“休戚相关”贴合“命运相关”的语境。"},{"t":"judge","q":"民警在小区门口守株待兔，一举抓获了嫌疑人。","a":"×","d":[],"dt":[],"idi":"守株待兔","m":"望文生义","n":"✗ 用法有误。“守株待兔”比喻不主动努力、心存侥幸、希望得到意外的收获，是贬义词。句中用它形容公安干警机智守候，感情色彩不当，属褒贬误用。"},{"t":"judge","q":"他百无聊赖，整天无所事事。","a":"√","d":[],"dt":[],"idi":"百无聊赖","m":"望文生义","n":"✓ 用法正确。“百无聊赖”指思想感情无所寄托、感到无聊。句中“无所事事”正合此义。"},{"t":"choice","q":"这地方地处瓜田，你在此弯腰系鞋带，难免有____之嫌。","a":"瓜田李下","d":["瓜熟蒂落","顺手牵羊","惹是生非"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"瓜田李下：经过瓜田不弯腰提鞋、走过李树下不举手正冠，比喻容易引起嫌疑的场合。句中“弯腰系鞋带”“有……之嫌”正合此义。易错点：最易被望文生义成“瓜果成熟、田园风光”，从而误选“瓜熟蒂落”（条件成熟、事情自然成功）；“顺手牵羊”指趁机偷拿东西，“惹是生非”指招惹是非，二者都指已发生的坏事，而非“容易引起嫌疑”。"},{"t":"judge","q":"他穷得一文不值。","a":"×","d":[],"dt":[],"idi":"一文不值","m":"望文生义","n":"✗ 用法有误。“一文不值”指毫无价值，形容东西不值钱或事物无意义，不能用来形容人穷。句中误把它当作“身无分文、不名一文”，属望文生义。"},{"t":"judge","q":"他作为下属，常对领导耳提面命、提出建议。","a":"×","d":[],"dt":[],"idi":"耳提面命","m":"对象误用","n":"✗ 用法有误。“耳提面命”形容长辈对晚辈恳切地教诲，只能用于“长辈对晚辈、师长对学生”。句中“下属对领导”方向相反，属对象误用。"},{"t":"judge","q":"他的创作一发不可收拾，佳作迭出。","a":"×","d":[],"dt":[],"idi":"一发不可收拾","m":"近义误用","n":"✗ 用法有误。“一发不可收拾”指事情一旦发生便不可收拾，是贬义词；而“一发而不可收”才指事情一经发动便无法停住、发展迅速（褒义）。句中要表达“创作旺盛、停不下来”，应用“一发而不可收”，属近义误用。"},{"t":"choice","q":"这篇论文考证严密、结论无懈可击，堪称____，后人不必再作修改。","a":"不刊之论","d":["不经之谈","无稽之谈","陈词滥调"],"dt":["望文生义","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"不刊之论：刊，削除、修改；指不可改动或不可磨灭的言论，形容文章或言论精当、无懈可击。句中“无懈可击”“不必再作修改”正照应“不可改动”之义。易错点：最易被望文生义成“不能刊登的言论”，一误解就会把“刊”当成“刊登”，从而误选含贬义的“不经之谈”（荒唐无根据的话）、“无稽之谈”（无从查考的话）、“陈词滥调”（陈旧空泛的言论）——三者都与“论证严密、无懈可击”的褒许语境直接冲突。"},{"t":"judge","q":"这篇文章振聋发聩，唤醒了无数麻木的人。","a":"√","d":[],"dt":[],"idi":"振聋发聩","m":"望文生义","n":"✓ 用法正确。“振聋发聩”比喻用语言文字唤醒糊涂麻木的人，使之清醒。句中“唤醒了无数麻木的人”正合此义。"},{"t":"judge","q":"北风呼啸，他冻得不寒而栗。","a":"×","d":[],"dt":[],"idi":"不寒而栗","m":"望文生义","n":"✗ 用法有误。“不寒而栗”指不寒冷而发抖，形容因恐惧而惊抖，并非“冷得发抖”。句中误把它当作“天冷发抖”，属望文生义。"},{"t":"choice","q":"社会上人员构成复杂，难免____，需要加强管理。","a":"鱼龙混杂","d":["参差不齐","良莠不齐","泥沙俱下"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"鱼龙混杂：鱼和龙混在一起，比喻好人和坏人混在一起。句中“人员构成复杂”正合此义。易错点：与“良莠不齐”“泥沙俱下”近义，但侧重点略有不同——“良莠不齐”侧重“好人坏人都有、品质参差”，“泥沙俱下”比喻好坏事物混杂出现，本句说的是“社会人员（人）的好坏混杂”，三者中“鱼龙混杂”最贴合“人员构成”的语境；“参差不齐”则只指水平高低，与“好坏”无关。"},{"t":"judge","q":"大家忙得不亦乐乎。","a":"√","d":[],"dt":[],"idi":"不亦乐乎","m":"望文生义","n":"✓ 用法正确。“不亦乐乎”常用来表示程度达到极点。“忙得不亦乐乎”即“忙到了极点”，是规范用法。"},{"t":"judge","q":"他披星戴月，早出晚归。","a":"√","d":[],"dt":[],"idi":"披星戴月","m":"望文生义","n":"✓ 用法正确。“披星戴月”形容早出晚归或昼夜赶路、辛劳奔波。句中“早出晚归”正合此义。"},{"t":"judge","q":"他耳闻目睹了事情的全过程。","a":"√","d":[],"dt":[],"idi":"耳闻目睹","m":"望文生义","n":"✓ 用法正确。“耳闻目睹”指亲耳听到、亲眼看到。句中“全过程”正合此义。"},{"t":"choice","q":"这两种观点的界限____，不容混淆。","a":"泾渭分明","d":["混淆是非","黑白不分","模棱两可"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"泾渭分明：泾河水清、渭河水浊，合流时清浊分明；比喻界限清楚、是非分明。句中“界限……不容混淆”正合此义。易错点：三个干扰项“混淆是非”（把对错弄混）、“黑白不分”（不分是非）、“模棱两可”（态度含糊）都与“界限清楚、不容混淆”相反。"},{"t":"judge","q":"他坚持到最后一刻，可惜半途而废，只差一步就成功了。","a":"×","d":[],"dt":[],"idi":"半途而废","m":"近义误用","n":"✗ 用法有误。“半途而废”指事情做到一半就停止，不能表示“只差最后一步而失败”。句中“只差一步就成功了”应用“功亏一篑”，误把两者相混。"},{"t":"judge","q":"他投桃报李，回赠了对方一份厚礼。","a":"√","d":[],"dt":[],"idi":"投桃报李","m":"望文生义","n":"✓ 用法正确。“投桃报李”指报答他人的好处。句中“回赠厚礼”正合此义。"},{"t":"judge","q":"我想帮他，却鞭长莫及，只能干着急。","a":"√","d":[],"dt":[],"idi":"鞭长莫及","m":"近义误用","n":"✓ 用法正确。“鞭长莫及”比喻力量达不到。句中“只能干着急”正合此义。"},{"t":"judge","q":"他俩一个去了南方，一个留在北方，从此分道扬镳。","a":"√","d":[],"dt":[],"idi":"分道扬镳","m":"望文生义","n":"✓ 用法正确。“分道扬镳”比喻目标不同而各奔前程或各干各的。句中“一个去南方、一个留北方”正合此义。"},{"t":"choice","q":"这套设备虽然老旧，但____，稍加修理就能再用。","a":"物尽其用","d":["暴殄天物","弃如敝屣","束之高阁"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"物尽其用：各种东西都充分发挥它们的功用。句中“稍加修理就能再用”正合此义。易错点：“暴殄天物”指任意糟蹋、浪费物品，“弃如敝屣”指像扔掉破鞋一样毫不可惜地抛弃，“束之高阁”指放着不用，三者都与“稍加修理就能再用”的惜物态度相反。"},{"t":"judge","q":"久别重逢，两人相谈甚欢。","a":"√","d":[],"dt":[],"idi":"久别重逢","m":"近义误用","n":"✓ 用法正确。“久别重逢”指长期分别后再次相见。句中“相谈甚欢”正合此义。"},{"t":"choice","q":"他的成就在业内首屈一指，令同辈____，难以企及。","a":"望尘莫及","d":["望其项背","望眼欲穿","望而却步"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"望尘莫及：望见前面人马扬起的尘土而追赶不上，比喻远远落后。句中“首屈一指”“难以企及”正合此义。易错点：最易与“望其项背”相混——后者是“赶得上、比得上”，且多用于否定式（如“难以望其项背”），用在此处表“落后”意思正相反；“望眼欲穿”指殷切盼望，“望而却步”指看到困难就退缩，都与“成就高、追不上”无关。"},{"t":"choice","q":"面对危险，他____地冲了上去，救出了被困的孩子。","a":"义无反顾","d":["铤而走险","孤注一掷","破罐破摔"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"义无反顾：在道义上只有勇往直前、绝不回头，是褒义词。句中“救出被困的孩子”正合褒义语境。易错点：该成语用于“为正义而勇往直前”——“铤而走险”指因无路可走而冒险，“孤注一掷”指危急时作最后一次冒险，“破罐破摔”指自暴自弃，三者都是贬义，用于救人义举即色彩颠倒。"},{"t":"choice","q":"他____，从不计较个人得失，在同事中威信很高。","a":"淡泊名利","d":["沽名钓誉","好大喜功","斤斤计较"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"淡泊名利：不看重、不追逐名位和利益，是褒义词。句中“从不计较个人得失”“威信很高”正合褒义语境。易错点：三个干扰项“沽名钓誉”（骗取名誉）、“好大喜功”（一心想做大事立大功）、“斤斤计较”（过分计较细小得失）都是贬义，与“威信很高”的褒许语境完全相反。"},{"t":"choice","q":"这种方法经过反复验证，____，每次都能成功。","a":"屡试不爽","d":["屡战屡败","一败涂地","屡教不改"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"屡试不爽：爽，差错；屡次试验都没有差错。句中“每次都能成功”正合此义。易错点：最易把“爽”望文生义成“爽快、顺利”或“失败”，从而误选“屡战屡败”“一败涂地”“屡教不改”这些含“失败”意味的贬义成语——本词恰恰是“从不失败”的意思。"},{"t":"judge","q":"大家对他的方案评头品足，认真讨论。","a":"×","d":[],"dt":[],"idi":"评头品足","m":"褒贬误用","n":"✗ 用法有误。“评头品足”比喻在小节上过分挑剔，是贬义词，不能表示“认真评议”。句中误把它当作“认真讨论”，属褒贬误用。"},{"t":"judge","q":"赌博之风在村里蔚然成风。","a":"×","d":[],"dt":[],"idi":"蔚然成风","m":"褒贬误用","n":"✗ 用法有误。“蔚然成风”形容一种事物逐渐发展盛行，形成一种良好风气，只能用于好事。句中用它形容“赌博之风”，属褒贬误用。"},{"t":"judge","q":"他在危难之际临危授命，接受了这项艰巨任务。","a":"×","d":[],"dt":[],"idi":"临危授命","m":"近义误用","n":"✗ 用法有误。“临危授命”指在危难之际献出生命，“授命”是“献出生命”之意；而“接受命令”应用“临危受命”。句中误把两者相混，属近义误用。"},{"t":"judge","q":"他交了些不三不四的朋友，令人担忧。","a":"√","d":[],"dt":[],"idi":"不三不四","m":"望文生义","n":"✓ 用法正确。“不三不四”形容不正派、不正经。句中用来形容“朋友”，正合此义。"},{"t":"choice","q":"十年前的手机与今天的智能手机，已不可____。","a":"同日而语","d":["相提并论","等量齐观","一概而论"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"同日而语：把不同时间的事情放在同一时间来谈论或看待，多用于否定句。句中“十年前”与“今天”构成明显的时间对比，正合此义。易错点：与“相提并论”“等量齐观”“一概而论”构成经典辨析组——“同日而语”专用于时间上的今昔对比，本句有“十年前／今天”的时间对照，故取“同日而语”。"},{"t":"choice","q":"他的演讲____，抑扬顿挫，极富感染力。","a":"声情并茂","d":["绘声绘色","栩栩如生","惟妙惟肖"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"声情并茂：声，音色；情，感情；形容演唱或朗诵时声音优美、感情丰富。句中“抑扬顿挫，极富感染力”正合此义。易错点：该成语用于演唱、朗诵等有声表演——“绘声绘色”用于描写叙述生动逼真（说或写），“栩栩如生”用于画中塑像等静态形象，“惟妙惟肖”用于模仿描摹逼真，三者都不含“声音优美、感情充沛”之意。"},{"t":"judge","q":"看到这感人的一幕，他情不自禁地流下了眼泪。","a":"√","d":[],"dt":[],"idi":"情不自禁","m":"望文生义","n":"✓ 用法正确。“情不自禁”指感情激动得不能控制。句中“情不自禁地流下了眼泪”正合此义。"},{"t":"choice","q":"他在会上____，从容陈述自己的方案，赢得一片掌声。","a":"侃侃而谈","d":["夸夸其谈","信口开河","大放厥词"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"侃侃而谈：侃侃，理直气壮、从容不迫的样子；形容从容不迫地谈话，是褒义词。句中“从容陈述”“赢得掌声”正合褒义语境。易错点：常被望文生义成“闲聊”，且易与贬义的“夸夸其谈”（说话浮夸不切实际）、“信口开河”（随口乱说）、“大放厥词”（大发谬论）相混，三者用于“赢得掌声”即成色彩颠倒。"},{"t":"judge","q":"经老师一点拨，他恍然大悟。","a":"√","d":[],"dt":[],"idi":"恍然大悟","m":"近义误用","n":"✓ 用法正确。“恍然大悟”形容一下子明白过来。句中“经老师一点拨”正合此义。"},{"t":"judge","q":"突如其来的暴雨，让大家措手不及。","a":"√","d":[],"dt":[],"idi":"措手不及","m":"望文生义","n":"✓ 用法正确。“措手不及”指来不及应付。句中“突如其来的暴雨”正合此义。"},{"t":"judge","q":"老师语重心长地嘱咐我们要注意安全。","a":"√","d":[],"dt":[],"idi":"语重心长","m":"望文生义","n":"✓ 用法正确。“语重心长”指言辞诚恳、情意深长。句中“嘱咐要注意安全”正合此义。"},{"t":"judge","q":"他踌躇满志，意气风发。","a":"√","d":[],"dt":[],"idi":"踌躇满志","m":"褒贬误用","n":"✓ 用法正确。“踌躇满志”形容心满意足、从容自得，是褒义词。句中“意气风发”正合此义。"},{"t":"judge","q":"这对兄弟相敬如宾，感情深厚。","a":"×","d":[],"dt":[],"idi":"相敬如宾","m":"对象误用","n":"✗ 用法有误。“相敬如宾”形容夫妻互相尊敬，只能用于夫妻之间。句中用它形容兄弟，属对象误用。"},{"t":"choice","q":"他在会上说：“我们这次能顺利完成调研，全靠市统计局____，在此谨致谢忱。”","a":"鼎力相助","d":["绵薄之力","抛砖引玉","聊表寸心"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"鼎力相助：鼎力，大力；敬辞，指对方的大力帮助，用于请托或感谢别人的帮助。句中感谢市局的帮助，正合此义。易错点：该成语只能用于对方或他人，说“我一定鼎力相助”便是错例，这是高考谦敬错位的经典考点；“绵薄之力”是谦辞，指自己微薄的力量；“抛砖引玉”是谦辞，用于自己先发言；“聊表寸心”是谦辞，用于自己送礼表达心意，三者都不能用来称说对方的帮助。"},{"t":"judge","q":"教师肢解了课文，导致学生目无全牛。","a":"×","d":[],"dt":[],"idi":"目无全牛","m":"望文生义","n":"✗ 用法有误。“目无全牛”指眼里看到的不是完整的牛、而是牛的筋骨结构，形容技艺达到极其纯熟的境界，并非“没有全局观念、把整体拆得支离破碎”。句中误把“全牛”理解为“整体”，属典型望文生义。"},{"t":"judge","q":"红花与绿叶相得益彰，相映成趣。","a":"√","d":[],"dt":[],"idi":"相得益彰","m":"近义误用","n":"✓ 用法正确。“相得益彰”指两者互相配合，双方的长处和作用更能显示出来。句中“红花绿叶相映成趣”正合此义。"},{"t":"judge","q":"他对身边的安全隐患熟视无睹。","a":"√","d":[],"dt":[],"idi":"熟视无睹","m":"近义误用","n":"✓ 用法正确。“熟视无睹”指看惯了却像没看见一样，形容对眼前的事物漠不关心。句中“安全隐患”正合此义。"},{"t":"choice","q":"市图书馆藏书达三百万册，真可谓____。","a":"汗牛充栋","d":["琳琅满目","鳞次栉比","美不胜收"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"汗牛充栋：用牛运书，牛累得出汗；用屋子放书，堆满屋子，形容藏书极多。句中“藏书三百万册”正合此义。易错点：该成语只能用于书籍多，是最典型的对象限制成语——“琳琅满目”用于精美的物品或诗文，“鳞次栉比”用于房屋等密集排列，“美不胜收”多用于景物，三者都不能形容书籍的数量。"},{"t":"judge","q":"他说话算数，一言九鼎。","a":"×","d":[],"dt":[],"idi":"一言九鼎","m":"望文生义","n":"✗ 用法有误。“一言九鼎”形容说的话分量很重、作用很大，不能表示“守信用、说话算数”。句中误把它当作“一言既出、驷马难追”，属望文生义。"},{"t":"choice","q":"这款新产品的市场表现平平，____了投资方的期待。","a":"不孚众望","d":["不负众望","深孚众望","众望所归"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不孚众望：孚，信服；不能使大家信服，也指没有符合大家的期望，是贬义。句中“市场表现平平”正是未达期待。易错点：与“不负众望”极易混淆，辨析关键——“孚＝信服、符合期望（贬）”，“负＝辜负（褒）”；“众望所归”指众人的信任归向某人，多用于人。“深孚众望”指很能使群众信服，是褒义，与句意相反，三者都不合语境。"},{"t":"choice","q":"春节一家人围坐吃年夜饭，尽享____。","a":"天伦之乐","d":["声色犬马","花天酒地","纸醉金迷"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"天伦之乐：天伦，父子、兄弟等亲属关系；指家庭亲人团聚的欢乐。句中“一家人围坐吃年夜饭”正合此义。易错点：该成语只能用于家人团聚之乐——“声色犬马”“花天酒地”“纸醉金迷”都指纵情享乐、奢侈糜烂的生活，是贬义，用于亲情团聚属对象与色彩的双重错误。"},{"t":"choice","q":"这篇文章见解深刻、立论精当，作者堪称____。","a":"大方之家","d":["落落大方","慷慨大方","小家碧玉"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"大方之家：大方，大道理；指见多识广、懂得大道理的人，后泛指精通某种学问或技艺的专家。句中“见解深刻、立论精当”正合此义。易错点：最易被望文生义成“大方的人”，把“大方”误作“慷慨、不拘束”，从而误选“落落大方”（举止自然得体）、“慷慨大方”（不吝啬）、“小家碧玉”（小户人家的美貌女子）——三者都与“行家、专家”无关。"},{"t":"choice","q":"两人棋艺相当，但都是____，实在难分高下。","a":"半斤八两","d":["各有千秋","旗鼓相当","不相上下"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"半斤八两：旧制一斤十六两，半斤等于八两，比喻彼此一样、不相上下，多含贬义（指都不怎么样）。句中“都是……实在难分高下”暗含“都不出色”的意味，正合贬义语境。易错点：该成语较多用于贬义——“各有千秋”指各有所长（褒），“旗鼓相当”“不相上下”都是中性，三者用于“都不怎么样”的语境即失当。"},{"t":"choice","q":"他是一位____的劳动模范，处处以身作则。","a":"名副其实","d":["名不副实","徒有虚名","名存实亡"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"名副其实：名称或名声与实际相符合。句中“劳动模范……处处以身作则”正写出“名实相符”。易错点：三个干扰项“名不副实”（名实不符）、“徒有虚名”（空有名声）、“名存实亡”（名义上存在实际已消亡）都与“处处以身作则”的褒扬语境相反。"},{"t":"judge","q":"他不遗余力地帮助贫困学生。","a":"√","d":[],"dt":[],"idi":"不遗余力","m":"望文生义","n":"✓ 用法正确。“不遗余力”指把全部力量都使出来，毫无保留。句中“帮助贫困学生”正合此义。"},{"t":"choice","q":"他给主编写信：“冒昧致信，有一____，望您拨冗一阅我的稿件。”","a":"不情之请","d":["鼎力相助","高抬贵手","不吝赐教"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"不情之请：不合情理的请求，是谦辞，用于向人求助时称自己的请求。句中“冒昧致信”“望您拨冗一阅”正合自谦求助之意。易错点：三个干扰项都是敬辞——“鼎力相助”指对方的大力帮助，“高抬贵手”用于请求对方通融，“不吝赐教”用于请对方指教，都不能用来称说自己的请求。"},{"t":"judge","q":"他见贤思齐，虚心向榜样学习。","a":"√","d":[],"dt":[],"idi":"见贤思齐","m":"望文生义","n":"✓ 用法正确。“见贤思齐”指见到有才德的人就想向他看齐。句中“向榜样学习”正合此义。"},{"t":"judge","q":"众口铄金，人多力量大。","a":"×","d":[],"dt":[],"idi":"众口铄金","m":"望文生义","n":"✗ 用法有误。“众口铄金”原指众口一词足以熔化金属，比喻谣言多了可以混淆是非，并非“人多力量大”。句中误把它理解为“团结力量大”，属望文生义。"},{"t":"judge","q":"他是一位莘莘学子，正在读高三。","a":"×","d":[],"dt":[],"idi":"莘莘学子","m":"望文生义","n":"✗ 用法有误。“莘莘学子”的“莘莘”指众多，本身已含“众多”之意，前面不能再加“一位”等数量词。句中“一位莘莘学子”搭配不当。"},{"t":"choice","q":"两位老人____，含饴弄孙，安享晚年。","a":"颐养天年","d":["天伦之乐","安居乐业","丰衣足食"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"颐养天年：颐养，保养；指保养身体、安度晚年。句中“两位老人”“安享晚年”正合此义。易错点：该成语只用于老年人安度晚年——“天伦之乐”指家人团聚的欢乐（重在“团聚”而非“晚年”），“安居乐业”指安定地生活、愉快地工作（用于一般民众），“丰衣足食”指吃穿充足（重在物质），三者都与“安享晚年”的特定对象不合。"},{"t":"choice","q":"老教授生活简朴，家中除书之外____。","a":"身无长物","d":["身无分文","一贫如洗","不名一文"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"身无长物：长，多余；除自身外再没有多余的东西，形容生活简朴或家境清贫。句中“生活简朴”“除书之外”正合此义。易错点：最易被望文生义成“没有特长、没有能力”，一误解就会用错场合；“身无分文”“一贫如洗”“不名一文”都专指贫穷到极点、身无分文，而句中强调的是“没有多余物品”的简朴，并非赤贫——藏书三万却“身无分文”是矛盾的。"},{"t":"choice","q":"新学期伊始，____重返校园，校园里又热闹起来。","a":"莘莘学子","d":["桃李满园","芸芸众生","同窗好友"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"莘莘学子：莘莘，众多的样子；指众多的学生。句中写学生返校，正合此义。易错点：该成语本身已含“众多”之意，前面不能再加“众多”“一位”等修饰；“桃李满园”的陈述主体是老师（桃李比喻所教学生），用来指学生本身属对象颠倒；“芸芸众生”指普普通通的一大群人，含贬义或中性；“同窗好友”指同学朋友，不能总括全体学生。"},{"t":"judge","q":"相比之下，他的表现相形见绌。","a":"√","d":[],"dt":[],"idi":"相形见绌","m":"望文生义","n":"✓ 用法正确。“相形见绌”指互相比较之下，一方显得很逊色。句中“相比之下”正合此义。"},{"t":"judge","q":"这位影星貌若天仙，美不胜收。","a":"×","d":[],"dt":[],"idi":"美不胜收","m":"对象误用","n":"✗ 用法有误。“美不胜收”指美好的东西太多，看不过来，多用于景物或事物，不能用来形容人。句中用它形容人的容貌，属对象误用。"},{"t":"judge","q":"他从小耳濡目染，爱上了戏曲。","a":"√","d":[],"dt":[],"idi":"耳濡目染","m":"望文生义","n":"✓ 用法正确。“耳濡目染”指经常听到看到而不知不觉受到影响。句中“从小……爱上了戏曲”正合此义。"},{"t":"judge","q":"他刚愎自用，听不进任何意见。","a":"√","d":[],"dt":[],"idi":"刚愎自用","m":"褒贬误用","n":"✓ 用法正确。“刚愎自用”指固执己见、不接受别人意见，是贬义词。句中“听不进任何意见”正合此义。"},{"t":"judge","q":"这对兄妹从小一起长大，如今劳燕分飞。","a":"×","d":[],"dt":[],"idi":"劳燕分飞","m":"对象误用","n":"✗ 用法有误。“劳燕分飞”专指夫妻、情侣离别，不能用于兄妹、朋友。句中用它形容兄妹分离，属对象误用。"},{"t":"choice","q":"洪水来袭，地处下游的村庄____，受灾最为严重。","a":"首当其冲","d":["首屈一指","名列前茅","当仁不让"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"首当其冲：冲，要冲、交通要道；比喻最先受到攻击或遭遇灾难。句中“地处下游”“受灾最为严重”正写出“最先遭灾”之义。易错点：常被望文生义成“首先冲在前面”或“首先应当做某事”，从而误选“首屈一指”（位居第一）、“名列前茅”（名次靠前）、“当仁不让”（遇到该做的事主动担当）——三者都与“遭灾”无关。"},{"t":"judge","q":"他如数家珍地介绍着家乡的特产。","a":"√","d":[],"dt":[],"idi":"如数家珍","m":"望文生义","n":"✓ 用法正确。“如数家珍”指对所讲的事情非常熟悉。句中“介绍着家乡的特产”正合此义。"},{"t":"choice","q":"他的发言避重就轻，____，没说到要害。","a":"闪烁其词","d":["直截了当","一针见血","开门见山"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"闪烁其词：说话遮遮掩掩、吞吞吐吐，不正面回答。句中“避重就轻”“没说到要害”正合此义。易错点：三个干扰项“直截了当”（言语行动爽快）、“一针见血”（一句话切中要害）、“开门见山”（一开头就进入正题）都是褒义的“爽快、切题”成语，与“避重就轻、吞吞吐吐”正好相反。"},{"t":"choice","q":"上级主管部门____，要求相关企业限期整改到位。","a":"三令五申","d":["耳提面命","苦口婆心","循循善诱"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"三令五申：再三地命令和告诫，多用于上级对下级。句中“上级主管部门”“限期整改”正合此义。易错点：该成语多用于上级对下级的再三告诫——“耳提面命”只用于长辈对晚辈的恳切教诲，“苦口婆心”多用于善意规劝人改正错误，“循循善诱”指善于引导别人学习，三者都不适用于“上级下达整改命令”这一庄重语境。"},{"t":"judge","q":"我军与敌军分庭抗礼，血战到底。","a":"×","d":[],"dt":[],"idi":"分庭抗礼","m":"望文生义","n":"✗ 用法有误。“分庭抗礼”原指宾主分立在庭院两侧、以对等的礼节相见，后比喻彼此以平等或对等的关系相处、平起平坐，并非“对抗、对峙”。句中误把它当作“对抗交锋”，属望文生义。"},{"t":"choice","q":"这两家企业的产品定位完全不同，不能____。","a":"相提并论","d":["同日而语","等量齐观","一概而论"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"相提并论：把不同的或相差悬殊的人或事物放在一起谈论或看待，多用于否定句。句中“定位完全不同”“不能……”正合此义。易错点：与“同日而语”的区别在于，后者专用于“时间”上的对比，而本句说的是“定位不同”（非时间），故用“相提并论”；“等量齐观”指把有差别的事物同等看待，“一概而论”指用同一标准对待，二者侧重点也各不相同。"},{"t":"judge","q":"他讲得不知所云，台下的听众一头雾水。","a":"√","d":[],"dt":[],"idi":"不知所云","m":"望文生义","n":"✓ 用法正确。“不知所云”指说话人语言紊乱或空洞，说得不好，不是听者不理解。句中“台下的听众一头雾水”正因“他讲得不知所云”，用法正确。"},{"t":"judge","q":"我自知才疏学浅，还请您多多指教。","a":"√","d":[],"dt":[],"idi":"才疏学浅","m":"谦敬错位","n":"✓ 用法正确。“才疏学浅”是谦辞，表示自己才学浅薄，用于自己正合适。"},{"t":"choice","q":"这件艺术品精巧绝伦，令所有参观者____。","a":"叹为观止","d":["瞠目结舌","目瞪口呆","大惊失色"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"叹为观止：观止，看到了尽头；赞美所见到的事物好到了极点，是褒义词。句中“精巧绝伦”正合褒义语境。易错点：该成语的主语必须是人（若主语是物，须说“令人叹为观止”），且只用于褒义——“瞠目结舌”“目瞪口呆”形容受窘、惊骇的样子，“大惊失色”形容非常惊恐，三者都是中性或贬义，与赞叹之情不合。"},{"t":"choice","q":"消息一经发布，便____，不到半天全公司都知道了。","a":"不胫而走","d":["不翼而飞","不谋而合","不约而同"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不胫而走：胫，小腿；没有腿却能跑，比喻消息、言论等不待推行就迅速传播。句中“消息……全公司都知道了”正合此义。易错点：与“不翼而飞”是经典对子——后者指东西突然丢失，高考惯例中“消息传得快”用“不胫而走”、“东西不见了”用“不翼而飞”；“不谋而合”“不约而同”都指“一致”，与传播无关。"},{"t":"judge","q":"救灾刻不容缓，必须立即行动。","a":"√","d":[],"dt":[],"idi":"刻不容缓","m":"望文生义","n":"✓ 用法正确。“刻不容缓”指形势紧迫、一刻也不能拖延。句中“必须立即行动”正合此义。"},{"t":"judge","q":"他高谈阔论，见解深刻，令人钦佩。","a":"×","d":[],"dt":[],"idi":"高谈阔论","m":"褒贬误用","n":"✗ 用法有误。“高谈阔论”指不切实际的空发议论，含贬义，并非“见解深刻”。句中用它赞美，属褒贬误用。"},{"t":"judge","q":"他迫不及待地想知道结果。","a":"√","d":[],"dt":[],"idi":"迫不及待","m":"望文生义","n":"✓ 用法正确。“迫不及待”指急迫得不能再等待。句中“想知道结果”正合此义。"},{"t":"judge","q":"学习知识要循序渐进，不能急于求成。","a":"√","d":[],"dt":[],"idi":"循序渐进","m":"望文生义","n":"✓ 用法正确。“循序渐进”指按照一定的步骤逐渐深入或提高。句中“不能急于求成”正合此义。"},{"t":"judge","q":"高考迫在眉睫，必须抓紧复习。","a":"√","d":[],"dt":[],"idi":"迫在眉睫","m":"望文生义","n":"✓ 用法正确。“迫在眉睫”比喻事情临近眼前、非常紧迫。句中“必须抓紧复习”正合此义。"},{"t":"judge","q":"这些都是无稽之谈，不可信。","a":"√","d":[],"dt":[],"idi":"无稽之谈","m":"望文生义","n":"✓ 用法正确。“无稽之谈”指无从查考、没有根据的话。句中“不可信”正合此义。"},{"t":"choice","q":"老人____，说什么也不愿离开生活了一辈子的故土。","a":"安土重迁","d":["背井离乡","随遇而安","四海为家"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"安土重迁：安于本乡本土，不愿轻易迁移。“重”是“看重、不轻易”之意，此处指把迁移看得很重。句中“不愿离开故土”正合此义。易错点：最易把“重迁”误解为“重视迁移”，意思正好用反，从而误选“背井离乡”（离开故乡）、“随遇而安”（随环境而安心）、“四海为家”（到处为家）——三者都与“留恋故土”相反。"},{"t":"judge","q":"我这次大材小用，屈就了这个职位。","a":"×","d":[],"dt":[],"idi":"大材小用","m":"谦敬错位","n":"✗ 用法有误。“大材小用”比喻才能高的人屈就低下的职位，是敬辞，用于称他人，不能用于自己。句中用于自己，属谦敬错位。"},{"t":"judge","q":"我一定率先垂范，带头遵守规定。","a":"×","d":[],"dt":[],"idi":"率先垂范","m":"谦敬错位","n":"✗ 用法有误。“率先垂范”指带头给下级或晚辈作示范，是敬辞，用于称颂他人带头，不能用于自己。句中用于自己，属谦敬错位。"},{"t":"judge","q":"他助纣为虐，为虎作伥。","a":"√","d":[],"dt":[],"idi":"为虎作伥","m":"褒贬误用","n":"✓ 用法正确。“为虎作伥”比喻给坏人做帮凶，是贬义词。句中“助纣为虐”正合此义。"},{"t":"choice","q":"他的书法笔力遒劲，____，被多家博物馆收藏。","a":"入木三分","d":["栩栩如生","活灵活现","绘声绘色"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"入木三分：原形容书法笔力强劲，后也比喻议论、见解深刻。句中“书法笔力遒劲”正合本义。易错点：该成语用于书法笔力或议论深刻——“栩栩如生”“活灵活现”用于艺术形象的逼真，“绘声绘色”用于描写叙述的生动，三者都不用于书法笔力。"},{"t":"choice","q":"面对两难抉择，他____，迟迟下不了决心。","a":"首鼠两端","d":["出尔反尔","朝三暮四","言而无信"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"首鼠两端：在两者之间迟疑不决、动摇不定。句中“迟迟下不了决心”正合此义。易错点：常被望文生义成“言行前后不一致”，从而误选“出尔反尔”（言行反复、自相矛盾）、“朝三暮四”（反复无常）、“言而无信”（说话不算数）——三者都指“反复、不守信”，不是“迟疑不决”。"},{"t":"choice","q":"学生给老师写信：“学生才疏学浅，文中谬误之处，恳请先生____。”","a":"不吝赐教","d":["抛砖引玉","敬谢不敏","洗耳恭听"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"不吝赐教：敬辞，用于自己向别人请教问题时。句中学生请老师指教，正合此义。易错点：“抛砖引玉”是谦辞，只能用于自己；“敬谢不敏”是谦辞，表示自己能力不够、推辞做某事，与“恳请”方向相反；“洗耳恭听”是敬辞，指恭敬地听别人讲话，多用于请人讲话时的客气话，都不能用于“请先生指教我”。"},{"t":"judge","q":"他恬不知耻，毫无廉耻之心。","a":"√","d":[],"dt":[],"idi":"恬不知耻","m":"褒贬误用","n":"✓ 用法正确。“恬不知耻”指做了坏事满不在乎、不以为耻，是贬义词。句中“毫无廉耻之心”正合此义。"},{"t":"choice","q":"他____地看了一遍展览，对展品只留下一个粗略的印象。","a":"走马观花","d":["浮光掠影","蜻蜓点水","浅尝辄止"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"走马观花：骑在奔跑的马上看花，比喻粗略地观察事物，强调观察的过程。句中“看了一遍”“只留下粗略印象”正写出观察过程不细。易错点：与“浮光掠影”是经典辨析对——本句有“看了一遍”的过程描写，故用“走马观花”；“蜻蜓点水”比喻做事肤浅不深入，“浅尝辄止”指略微尝试就停止，二者多用于学习、钻研。"},{"t":"judge","q":"他兢兢业业，几十年如一日。","a":"√","d":[],"dt":[],"idi":"兢兢业业","m":"望文生义","n":"✓ 用法正确。“兢兢业业”形容做事谨慎、勤恳负责。句中“几十年如一日”正合此义。"},{"t":"choice","q":"球队在决赛中顶住压力、最终夺冠，____了全校师生的期望。","a":"不负众望","d":["不孚众望","深孚众望","名副其实"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不负众望：负，辜负；没有辜负大家的期望，是褒义词。句中“最终夺冠”正是“没有辜负期望”。易错点：与“不孚众望”是高考必考的一对——“孚”是“使人信服”，“不孚众望”指不能使大家信服，一字之差而褒贬相反；“深孚众望”指很能使群众信服，虽也是褒义，但句中需要的是“没辜负期望”这一层；“名副其实”指名称与实质相符，与“期望”无关。"},{"t":"choice","q":"他随信附上一点家乡土产，写道：“____，不成敬意，还望笑纳。”","a":"聊表寸心","d":["鼎力相助","不吝赐教","大驾光临"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"聊表寸心：略微表达一下自己的心意，是谦辞，用于自己送礼或表达谢意时。句中“不成敬意，还望笑纳”正合自谦之意。易错点：三个干扰项都是敬辞——“鼎力相助”用于感谢或请托对方的帮助，“不吝赐教”用于请对方指教，“大驾光临”用于称对方到来，都不能用来称说自己送礼。"},{"t":"choice","q":"年轻人追求时尚、喜欢新奇，这本____，但不能因此荒废学业。","a":"无可厚非","d":["无可非议","情有可原","理所当然"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"无可厚非：厚，过分；非，责备；不可以过分责备，表示虽有缺点但可以谅解。句中“但不能因此荒废学业”的转折，正说明前一事虽有小问题却可谅解。易错点：与“无可非议”（完全没有可指责的、完全正确）程度相差很大，高考常以“但”字提示的让步语气来设题——有“但”的让步，须用“无可厚非”；“理所当然”指按道理应当这样，与“本可谅解”的语境不合。“情有可原”指按情理有可原谅的地方，与“无可厚非”近义，但本句重在“不必过分责备”而非“情有可原”。"},{"t":"judge","q":"这些靡靡之音，腐蚀着青少年的心灵。","a":"√","d":[],"dt":[],"idi":"靡靡之音","m":"褒贬误用","n":"✓ 用法正确。“靡靡之音”指颓废、淫靡的乐曲，是贬义词。句中“腐蚀心灵”正合此义。"},{"t":"choice","q":"好好的一篇文章，被他删改得____，早已看不出原来的样子。","a":"面目全非","d":["焕然一新","耳目一新","面目一新"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"面目全非：事物的样子改变得很厉害，多指变得很糟，是贬义词。句中“好好的文章，被删改得……”“面目全非”正合贬义语境。易错点：该成语强调“变得糟糕”——“焕然一新”“耳目一新”“面目一新”都指面貌一新、变得更好（褒义），与“被改糟”的语境正好相反。"},{"t":"choice","q":"听到这个好消息，大家____地鼓起掌来。","a":"不约而同","d":["不谋而合","异口同声","如出一辙"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不约而同：没有事先约定而彼此的行动完全一致。句中“鼓起掌来”是具体动作，且有“地”作状语，正合此义。易错点：与“不谋而合”是经典辨析对——“不约而同”多指具体行动一致、一般只作状语，“不谋而合”多指见解、主张一致、可作谓语；本句写的是“动作”且用作状语，只能用“不约而同”；“异口同声”指大家说法一致。“如出一辙”形容两件事非常相似，与“行动一致”不同。"},{"t":"judge","q":"黄河水位江河日下，越涨越高。","a":"×","d":[],"dt":[],"idi":"江河日下","m":"望文生义","n":"✗ 用法有误。“江河日下”比喻事物日趋衰落、情况一天不如一天，并非“江河的水位一天天下降”。句中把它当成了字面意义的“水位下降”，属望文生义。"},{"t":"judge","q":"他的成就令人难以望其项背。","a":"√","d":[],"dt":[],"idi":"望其项背","m":"近义误用","n":"✓ 用法正确。“望其项背”指赶得上、比得上，多用于否定式。“难以望其项背”即“难以企及”，用法正确。"},{"t":"judge","q":"这个问题太复杂，简直不可理喻。","a":"×","d":[],"dt":[],"idi":"不可理喻","m":"望文生义","n":"✗ 用法有误。“不可理喻”指不能用道理使之明白，形容态度蛮横、不讲道理，陈述对象是人，并非“不可理解”。句中误把它当作“难以理解”，属望文生义。"},{"t":"choice","q":"她的歌声优美动听，____，让人久久难忘。","a":"余音绕梁","d":["绘声绘色","栩栩如生","惟妙惟肖"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"余音绕梁：歌声或乐曲的余音回旋不绝，形容歌声或音乐优美、令人回味。句中写“歌声优美动听”，正合此义。易错点：该成语专用于歌声、音乐——“绘声绘色”形容描写叙述生动，“栩栩如生”形容静态艺术形象逼真，“惟妙惟肖”形容模仿描摹逼真，三者都不能形容歌声。"},{"t":"choice","q":"此人位高权重，____，一时间无人敢招惹。","a":"炙手可热","d":["家喻户晓","红极一时","妇孺皆知"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"炙手可热：手一挨近就感觉烫，形容气焰很盛、权势很大。句中“位高权重”“无人敢招惹”正合“权势熏天”之义。易错点：媒体常误用它形容“很红、很吃香”，把“热”望文生义成“热门、名气大”，从而误选“家喻户晓”“红极一时”“妇孺皆知”这些表示“名气大”的褒义成语——三者都不含“权势”之意，与“无人敢招惹”的语境不合。"},{"t":"judge","q":"他是团队的中流砥柱。","a":"√","d":[],"dt":[],"idi":"中流砥柱","m":"望文生义","n":"✓ 用法正确。“中流砥柱”比喻能担当重任、起中坚作用的人或集体。句中“团队的中坚”正合此义。"},{"t":"judge","q":"他买椟还珠，舍本逐末。","a":"√","d":[],"dt":[],"idi":"买椟还珠","m":"望文生义","n":"✓ 用法正确。“买椟还珠”比喻没有眼光、取舍不当。句中“舍本逐末”正合此义。"},{"t":"judge","q":"他见异思迁，频繁跳槽，一事无成。","a":"√","d":[],"dt":[],"idi":"见异思迁","m":"望文生义","n":"✓ 用法正确。“见异思迁”指意志不坚定、喜爱不专一。句中“频繁跳槽、一事无成”正合此义。"},{"t":"judge","q":"三月的呼伦贝尔大草原草长莺飞，春光迷人。","a":"×","d":[],"dt":[],"idi":"草长莺飞","m":"望文生义","n":"✗ 用法有误。“草长莺飞”专指江南暮春时节的景色，有其特定的地域与时令，不能用来形容北方的草原。句中把江南的春色套用到呼伦贝尔大草原，属对象（地域）误用。"},{"t":"choice","q":"他谦虚地说：“我这点本事不过是____，哪敢在各位行家面前卖弄。”","a":"雕虫小技","d":["真才实学","满腹经纶","学富五车"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"雕虫小技：比喻微不足道的技能，是谦辞，多用来称自己的技艺。句中“我这点本事”“哪敢卖弄”正合自谦之意。易错点：三个干扰项“真才实学”（真正的才能学问）、“满腹经纶”（很有才学智谋）、“学富五车”（读书多、学问渊博）都是称颂他人才学的敬辞色彩表达，用来称说自己的本事既属谦敬错位，又与“哪敢卖弄”的自谦矛盾。"},{"t":"choice","q":"他才思敏捷，____，一篇千字文一气呵成。","a":"文不加点","d":["字斟句酌","深思熟虑","咬文嚼字"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"文不加点：点，涂改；文章一气写成、不用涂改，形容文思敏捷、写作技巧纯熟。句中“才思敏捷”“一气呵成”正合此义。易错点：最易被望文生义成“不加标点”，把“点”误解为“标点符号”；“字斟句酌”“深思熟虑”“咬文嚼字”都强调反复推敲、慢工细活，与“一气呵成”的敏捷正好相反。"},{"t":"judge","q":"您请讲，我洗耳恭听。","a":"√","d":[],"dt":[],"idi":"洗耳恭听","m":"谦敬错位","n":"✓ 用法正确。“洗耳恭听”是敬辞，指恭敬而认真地听人讲话，多用于请人讲话时的客气话。句中用于“我”听“您”讲，正合适。"},{"t":"judge","q":"他淋了一场大雨，浑身毫发不爽。","a":"×","d":[],"dt":[],"idi":"毫发不爽","m":"望文生义","n":"✗ 用法有误。“毫发不爽”的“爽”是“差错”之意，指一点也不差、形容极其精确，并非“不舒服、不爽快”。句中误把“爽”理解为“舒服”，属望文生义。"},{"t":"judge","q":"保护环境，人人责无旁贷。","a":"√","d":[],"dt":[],"idi":"责无旁贷","m":"望文生义","n":"✓ 用法正确。“责无旁贷”指自己应尽的责任、不能推卸给别人。句中“人人”正合此义。"},{"t":"judge","q":"这件古董一文不名，不值几个钱。","a":"×","d":[],"dt":[],"idi":"一文不名","m":"望文生义","n":"✗ 用法有误。“一文不名”的“名”是“占有”之意，指一个钱都没有、形容人极其贫穷，不能用来形容“物品不值钱”。句中误把它当作“一文不值”，属望文生义。"},{"t":"choice","q":"这位老先生____，从不居功自傲，深得晚辈敬重。","a":"虚怀若谷","d":["妄自尊大","刚愎自用","目空一切"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"虚怀若谷：胸怀像山谷一样深广，形容十分谦虚、能容纳别人意见，是带敬辞色彩的褒义成语，只能用于称颂他人。句中“从不居功自傲，深得敬重”正合此义。易错点：该成语只能用于他人，不能用于自己；“妄自尊大”（狂妄自大）、“刚愎自用”（固执己见）、“目空一切”（什么都不放在眼里）都是贬义，与“深得敬重”相反。"},{"t":"judge","q":"游客纷至沓来，景区热闹非凡。","a":"√","d":[],"dt":[],"idi":"纷至沓来","m":"望文生义","n":"✓ 用法正确。“纷至沓来”指接连不断地到来。句中“游客……热闹非凡”正合此义。"},{"t":"choice","q":"他给老师发去短信：“学生愚钝，有一事不明，____，恳请老师指点。”","a":"不揣冒昧","d":["不吝赐教","抛砖引玉","敬谢不敏"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"不揣冒昧：揣，揣度、考虑；不考虑自己的冒昧，是谦辞，用于自己向人提出请求或陈述意见时的客气话。句中学生向老师请教，正合此义。易错点：“不吝赐教”是敬辞，用于请对方指教自己，不能用来称说自己的提问；“抛砖引玉”是谦辞，用于自己先发言引出高见；“敬谢不敏”是推辞，与“恳请指点”矛盾。"},{"t":"judge","q":"他意气用事，一时冲动辞了职。","a":"√","d":[],"dt":[],"idi":"意气用事","m":"望文生义","n":"✓ 用法正确。“意气用事”指凭感情办事、缺乏理智。句中“一时冲动辞了职”正合此义。"},{"t":"judge","q":"谈判桌上剑拔弩张，气氛紧张。","a":"√","d":[],"dt":[],"idi":"剑拔弩张","m":"望文生义","n":"✓ 用法正确。“剑拔弩张”形容形势紧张、一触即发。句中“气氛紧张”正合此义。"},{"t":"choice","q":"他总爱____，对别人的事指手画脚。","a":"好为人师","d":["诲人不倦","循循善诱","言传身教"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"好为人师：好，喜欢；喜欢当别人的老师，形容不谦虚、爱摆老资格教训人，是贬义词。句中“对别人的事指手画脚”正合贬义语境。易错点：与褒义的“诲人不倦”（耐心教导、不知疲倦）一字之隔、褒贬相反；“循循善诱”“言传身教”也都是褒义，用于“指手画脚”即色彩颠倒。"},{"t":"judge","q":"区区小事，不足挂齿。","a":"√","d":[],"dt":[],"idi":"不足挂齿","m":"谦敬错位","n":"✓ 用法正确。“不足挂齿”指不值得一提，是谦辞。句中“区区小事”正合自谦之意。"},{"t":"judge","q":"这件事他一挥而就，轻松搞定了。","a":"×","d":[],"dt":[],"idi":"一挥而就","m":"近义误用","n":"✗ 用法有误。“一挥而就”形容写字、作文、画画很快就完成，只能用于文艺创作，不能表示“办事轻松”。句中用它形容办事，属对象误用。"},{"t":"judge","q":"这篇文章短小精悍，很有力量。","a":"√","d":[],"dt":[],"idi":"短小精悍","m":"望文生义","n":"✓ 用法正确。“短小精悍”形容文章、言论简短有力。句中“很有力量”正合此义。"},{"t":"judge","q":"在太平盛世里，大家相濡以沫，互帮互助。","a":"×","d":[],"dt":[],"idi":"相濡以沫","m":"对象误用","n":"✗ 用法有误。“相濡以沫”比喻在困境中用微薄的力量相互救助，特指患难与共的处境。句中“太平盛世”与“困境”矛盾，属对象（语境）误用。"},{"t":"choice","q":"面对失败，他从不____，而是总结经验继续前进。","a":"怨天尤人","d":["百折不挠","愈挫愈勇","自强不息"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"怨天尤人：遇到挫折就埋怨天命、责怪别人，是贬义词。句中“而是总结经验继续前进”的转折表明前半应填“不……”的贬义成语，正合贬义语境。易错点：三个干扰项“百折不挠”“愈挫愈勇”“自强不息”都是褒义词，形容面对挫折不屈服，与“从不”的否定结构搭配后会与“继续前进”语义重复、逻辑不通。"},{"t":"judge","q":"他翻云覆雨的笔力，令人叹服。","a":"×","d":[],"dt":[],"idi":"翻云覆雨","m":"褒贬误用","n":"✗ 用法有误。“翻云覆雨”比喻反复无常或玩弄手段，是贬义词，并非“气势磅礴、笔力雄健”。句中用它赞美文笔，属褒贬误用。"},{"t":"choice","q":"研讨会上，主持人先讲了几句开场白，然后说：“我这几句就算是____，下面请李教授指正。”","a":"抛砖引玉","d":["不吝赐教","高抬贵手","虚左以待"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"抛砖引玉：谦辞，比喻用自己粗浅、不成熟的意见引出别人高明的意见，只能用于自己。句中主持人称“我这几句”，是自谦，正合此义。易错点：该成语是高考谦敬错位的头号考点，判据只有一条——“砖”是自己的、“玉”是别人的；“不吝赐教”是敬辞（请对方指教自己），“高抬贵手”是敬辞（请对方通融），“虚左以待”是敬辞（空位恭候他人），都不能用来称说自己的发言。"},{"t":"choice","q":"老师对学生的生活关怀____，事无巨细。","a":"无微不至","d":["无所不至","无孔不入","无所不为"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"无微不至：微，细微；至，到；指无论如何细微的地方都照顾到，形容关怀照顾得非常周到，是褒义词。句中“关怀……事无巨细”正合褒义语境。易错点：“无所不至”指没有达不到的地方，也指什么坏事都干得出来，是贬义词，与“无微不至”一字之差、褒贬相反，是高考经典辨析；“无孔不入”“无所不为”也都含贬义，用于赞扬关怀即色彩颠倒。"},{"t":"judge","q":"他呕心沥血地算计着别人的财产。","a":"×","d":[],"dt":[],"idi":"呕心沥血","m":"褒贬误用","n":"✗ 用法有误。“呕心沥血”比喻费尽心血，多用于创作、事业等正面行为，是褒义词。句中用它形容“算计别人”，属褒贬误用。"},{"t":"judge","q":"经过反复推敲，方案终于水落石出。","a":"×","d":[],"dt":[],"idi":"水落石出","m":"望文生义","n":"✗ 用法有误。“水落石出”比喻事情真相完全显露，只能用于“真相大白”，不能表示“问题解决、有了结果”。句中误把它当作“有了着落、办成了”，属望文生义。"},{"t":"choice","q":"朋友请他帮忙，他婉言道：“此事我恐怕____，还请另请高明。”","a":"敬谢不敏","d":["不吝赐教","当仁不让","义不容辞"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"敬谢不敏：谢，推辞；不敏，没有才能；恭敬地表示能力不够、不能接受，是谦辞，用于自己推辞做某事。句中“还请另请高明”正合推辞之意。易错点：“不吝赐教”是敬辞，方向与推辞相反；“当仁不让”指遇到该做的事就主动去做、不推让，“义不容辞”指道义上不容许推辞，二者都与“婉言推辞”完全相反。"},{"t":"choice","q":"夫妻俩____这家小店十余年，如今终于有了起色。","a":"惨淡经营","d":["门可罗雀","入不敷出","每况愈下"],"dt":["对象误用","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"惨淡经营：惨淡，苦心极力；经营，筹划营谋；形容苦费心思地谋划并从事某项事业。句中写夫妻二人苦心经营小店、终有起色，是褒义用法。易错点：最易被望文生义成“生意萧条、经营惨淡”，一误解就会错选“门可罗雀”（门前冷落）、“入不敷出”（收入不够支出）、“每况愈下”（越来越糟），三者都与“有了起色”相反。"},{"t":"judge","q":"他语无伦次，说话颠三倒四。","a":"√","d":[],"dt":[],"idi":"语无伦次","m":"望文生义","n":"✓ 用法正确。“语无伦次”指话讲得颠三倒四、没有条理。句中“颠三倒四”正合此义。"},{"t":"judge","q":"他振振有词地为自己狡辩。","a":"√","d":[],"dt":[],"idi":"振振有词","m":"褒贬误用","n":"✓ 用法正确。“振振有词”形容理由似乎很充分、说个不停，其实是强词夺理，是贬义词。句中“狡辩”正合此义。"},{"t":"judge","q":"这些谣言蛊惑人心，扰乱视听。","a":"√","d":[],"dt":[],"idi":"蛊惑人心","m":"褒贬误用","n":"✓ 用法正确。“蛊惑人心”指使人心意迷惑，是贬义词。句中用来形容谣言，正合此义。"},{"t":"judge","q":"两人的性格迥然不同。","a":"√","d":[],"dt":[],"idi":"迥然不同","m":"望文生义","n":"✓ 用法正确。“迥然不同”形容相差很远、完全不一样。句中“性格”正合此义。"},{"t":"judge","q":"他年纪轻轻，却总能虚心向晚辈不耻下问。","a":"×","d":[],"dt":[],"idi":"不耻下问","m":"望文生义","n":"✗ 用法有误。“不耻下问”指不以向学问比自己差或地位比自己低的人请教为耻，只能用于“上问下”。句中“向晚辈请教”方向相反，属对象误用。"},{"t":"judge","q":"他安然无恙地回来了。","a":"√","d":[],"dt":[],"idi":"安然无恙","m":"近义误用","n":"✓ 用法正确。“安然无恙”指平平安安、没有受到损害。句中“回来了”正合此义。"},{"t":"judge","q":"她的表演矫揉造作，令人反感。","a":"√","d":[],"dt":[],"idi":"矫揉造作","m":"褒贬误用","n":"✓ 用法正确。“矫揉造作”形容过分做作、极不自然，是贬义词。句中“令人反感”正合此义。"},{"t":"judge","q":"他办事麻利，无论做什么都倚马可待。","a":"×","d":[],"dt":[],"idi":"倚马可待","m":"望文生义","n":"✗ 用法有误。“倚马可待”指站在即将出发的战马前起草文件、很快即可完稿，专指文思敏捷、写文章快，并非“做事迅速、雷厉风行”。句中误用来形容办事麻利，属望文生义。"},{"t":"choice","q":"他____，替人冒险跑腿，到头来自己什么好处也没得到。","a":"火中取栗","d":["投机取巧","坐收渔利","不劳而获"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"火中取栗：比喻受人利用、冒险替人出力，结果白吃苦头、自己一无所得。句中“替人冒险跑腿”“自己什么也没得到”正合此义。易错点：易被望文生义成“冒着危险取东西”的正面行为，从而忽略它“被人利用、白忙一场”的核心；“投机取巧”指用不正当手段谋利，“坐收渔利”“不劳而获”都指自己不费力而获利，与“白吃苦头”正好相反。"},{"t":"judge","q":"他触类旁通，学什么都很快。","a":"√","d":[],"dt":[],"idi":"触类旁通","m":"望文生义","n":"✓ 用法正确。“触类旁通”指掌握了某一事物的规律就能推知同类事物。句中“学什么都很快”正合此义。"},{"t":"choice","q":"朋友搬了新居，你去祝贺，见面第一句话应该说：“恭喜____！”","a":"乔迁之喜","d":["蓬荜生辉","大驾光临","高朋满座"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"乔迁之喜：语出《诗经·小雅·伐木》“出自幽谷，迁于乔木”，贺人迁居的客套话。句中祝贺朋友搬新居，正合此义。易错点：“蓬荜生辉”是谦辞，只能用于自己家（说“让您这儿蓬荜生辉”等于说对方的房子是蓬门荜户，极不得体）；“大驾光临”“高朋满座”都是敬辞，用于称宾客，不能用作贺词。"},{"t":"choice","q":"这个骗子____，开始四处招摇撞骗。","a":"粉墨登场","d":["登台亮相","抛头露面","崭露头角"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"粉墨登场：化装后登台演戏，今多比喻坏人经过一番打扮登上政治舞台，是贬义词。句中“骗子……招摇撞骗”正合贬义语境。易错点：该成语现代多用于贬义——“登台亮相”是中性，“抛头露面”多指人出面露面（中性），“崭露头角”比喻显露才能（褒义），三者都不能表达“坏人粉饰登台”的贬斥。"},{"t":"choice","q":"她讲的故事____，孩子们一个个听得入了迷。","a":"娓娓动听","d":["栩栩如生","美轮美奂","汗牛充栋"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"娓娓动听：娓娓，说话连续不倦的样子；形容讲话生动、使人爱听。句中写“讲的故事……听得入了迷”，正合此义。易错点：该成语专用于讲话、叙述——“栩栩如生”形容艺术形象，“美轮美奂”只用于房屋建筑，“汗牛充栋”只形容书籍多，三者用于“讲故事”均属对象误用。"},{"t":"judge","q":"这件事非同小可，岂可等闲视之。","a":"√","d":[],"dt":[],"idi":"等闲视之","m":"望文生义","n":"✓ 用法正确。“等闲视之”指把事物看得平常、不加重视。句中“非同小可，岂可等闲视之”正合此义。"},{"t":"judge","q":"这项发明石破天惊，在整个行业引起了轰动。","a":"×","d":[],"dt":[],"idi":"石破天惊","m":"望文生义","n":"✗ 用法有误。“石破天惊”原形容箜篌声音忽而高亢忽而低沉、出人意外，后多比喻文章、议论新奇惊人，并非“事情惊天动地、令人震惊”。句中用它形容“发明”，属对象误用。"},{"t":"choice","q":"他为了博取眼球，故意夸大事实，编造了一条____的假消息。","a":"耸人听闻","d":["骇人听闻","危言耸听","捕风捉影"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"耸人听闻：故意夸大或捏造事实，使人听了感到震惊，强调主观上的夸大渲染。句中“故意夸大事实”“编造假消息”正合此义。易错点：与“骇人听闻”是经典辨析对——前者是“故意夸大以耸动”，后者是“客观事实本身就令人震惊”，本句有“故意夸大”的主观色彩，故用“耸人听闻”；“危言耸听”指故意说吓人的话，同属主观一类，但侧重“话语恐吓”而非“捏造消息”。“捕风捉影”指说话做事以似是而非的迹象作根据，与“故意夸大捏造”不同。"},{"t":"choice","q":"这起食品安全事故后果极其严重，____，立刻引起监管部门重视。","a":"骇人听闻","d":["耸人听闻","危言耸听","不可思议"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"骇人听闻：使人听了非常吃惊，多指社会上发生的坏事，强调客观事实本身就令人震惊。句中“事故后果严重”是已发生的客观事实，正合此义。易错点：与“耸人听闻”的区别在于后者强调“故意夸大、捏造”的主观色彩；“危言耸听”指故意说吓人的话使人震惊，也属主观；“不可思议”指不可想象、不能理解，多含神秘奥妙之意，不含“令人震惊的坏事”这一层。"},{"t":"judge","q":"与其临渊羡鱼，不如退而结网。","a":"√","d":[],"dt":[],"idi":"临渊羡鱼","m":"望文生义","n":"✓ 用法正确。“临渊羡鱼”比喻只有愿望而不去实干。句中“不如退而结网”正合此义。"},{"t":"judge","q":"三人成虎，团结起来力量大。","a":"×","d":[],"dt":[],"idi":"三人成虎","m":"望文生义","n":"✗ 用法有误。“三人成虎”指谣言重复多次，就能使人信以为真，并非“团结力量大”。句中误把它理解为“众人齐心”，属望文生义。"},{"t":"judge","q":"坐在春日的暖阳里，真是如坐春风。","a":"×","d":[],"dt":[],"idi":"如坐春风","m":"望文生义","n":"✗ 用法有误。“如坐春风”比喻在不知不觉中受到长辈或良师的恳切教诲，与“景物、天气”无关。句中误把它理解为“坐在春风里”，属望文生义。"},{"t":"choice","q":"夺冠的喜讯传来，全城____，人们纷纷涌上街头欢呼庆祝。","a":"万人空巷","d":["门可罗雀","鸦雀无声","空穴来风"],"dt":["褒贬误用","褒贬误用","望文生义"],"idi":"","m":"望文生义","n":"万人空巷：家家户户的人都从巷子里出来涌到大街上，形容庆祝、欢迎等盛况。句中“涌上街头欢呼庆祝”正合此义。易错点：最易被望文生义成“街巷空无一人”，一误解就会错选“门可罗雀”（门前冷落、宾客稀少）或“鸦雀无声”（非常安静），二者与“涌上街头欢呼”的场面恰好相反；“空穴来风”指传闻有一定根据，与语境无关。"},{"t":"choice","q":"她正值____，天真烂漫，对未来充满憧憬。","a":"豆蔻年华","d":["徐娘半老","风烛残年","黄发垂髫"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"豆蔻年华：豆蔻，一种初夏开花的草本植物，比喻少女；指女子十三四岁的年纪。句中“天真烂漫”正合此义。易错点：该成语有严格的性别与年龄限制——“徐娘半老”指中年妇女，“风烛残年”指年老体衰，“黄发垂髫”泛指老人和小孩，三者都与“少女”不合。"},{"t":"choice","q":"空气质量与每个人的健康____，人人都应重视。","a":"息息相关","d":["休戚相关","唇亡齿寒","休戚与共"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"息息相关：息，呼吸时进出的气息；呼吸相关联，比喻关系或联系非常密切。句中“空气质量与健康”是事物之间的联系，正合此义。易错点：与“休戚相关”是经典辨析对——后者专指“人的祸福、利害”相关，而“空气质量与健康”是事物与人的联系，非“人与人之间的祸福与共”，故用“息息相关”；“唇亡齿寒”“休戚与共”都侧重利害一致，也不合。"},{"t":"choice","q":"这首诗____，千百年来广为传诵。","a":"脍炙人口","d":["汗牛充栋","喜闻乐见","津津乐道"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"脍炙人口：脍和炙都是人们爱吃的食物，比喻好的诗文或事物为众人所赞美和传诵。句中“这首诗……广为传诵”正合此义。易错点：该成语的陈述对象只能是作品、诗文等被传诵的对象——“汗牛充栋”只形容书籍多，不能形容“一首诗被传诵”；“喜闻乐见”的主体是喜欢听看的接受者，“津津乐道”指有兴趣地谈论，主体都是人，不能用来陈述“诗”本身。"},{"t":"judge","q":"这条消息不翼而飞，迅速传遍了全城。","a":"×","d":[],"dt":[],"idi":"不翼而飞","m":"近义误用","n":"✗ 用法有误。“不翼而飞”指东西突然丢失，不能用于“消息传播”。消息传得快应用“不胫而走”，句中误把两者相混。"},{"t":"judge","q":"我军出奇制胜了敌军。","a":"×","d":[],"dt":[],"idi":"出奇制胜","m":"近义误用","n":"✗ 用法有误。“出奇制胜”指用奇兵或奇计战胜敌人，比喻用对方意想不到的方法取胜，作谓语时不能带宾语。句中让它带宾语“敌军”，属搭配不当。"},{"t":"choice","q":"他的演讲____，妙语连珠，引得满堂喝彩。","a":"妙趣横生","d":["栩栩如生","美轮美奂","汗牛充栋"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"妙趣横生：横生，层出不穷地出现；形容说话、诗文等充满美妙的情趣。句中写“演讲……妙语连珠”，正合此义。易错点：该成语专用于话语、诗文——“栩栩如生”形容艺术形象，“美轮美奂”只用于房屋建筑，“汗牛充栋”只形容书籍多，三者用于“演讲”均属对象误用。"},{"t":"choice","q":"近年来，各类创业公司如____般涌现，充满活力。","a":"雨后春笋","d":["层出不穷","接二连三","纷至沓来"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"雨后春笋：春天下雨后竹笋长得又快又多，比喻新生事物迅速大量涌现，含褒义。句中“创业公司涌现”“充满活力”正合褒义语境，且“如雨后春笋”是固定搭配。易错点：该成语只用于新生事物的大量涌现，含“新生、蓬勃”的褒义——“层出不穷”指接连出现、没有穷尽（中性），“接二连三”“纷至沓来”都不含“新生事物”的色彩，用于此处即失当。"},{"t":"choice","q":"科研团队____，经过上千次试验终于攻克了技术难关。","a":"殚精竭虑","d":["处心积虑","挖空心思","费尽心机"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"殚精竭虑：殚，尽；用尽精力、费尽心思，是褒义词。句中“攻克技术难关”正合褒义语境。易错点：与贬义的“处心积虑”是经典反义对，一字之别、褒贬相反；“挖空心思”“费尽心机”也都含贬义，用于褒扬科研人员即色彩颠倒。"},{"t":"judge","q":"这位木匠妙手回春，修好了这套古家具。","a":"×","d":[],"dt":[],"idi":"妙手回春","m":"对象误用","n":"✗ 用法有误。“妙手回春”称赞医生医术高明、能把垂危的病人治好，只能用于医术。句中用它形容木工手艺，属对象误用。"},{"t":"judge","q":"他刚开工三天就功亏一篑，彻底放弃了。","a":"×","d":[],"dt":[],"idi":"功亏一篑","m":"近义误用","n":"✗ 用法有误。“功亏一篑”指只差最后一点而未能成功，不能表示“做了一半就放弃”。句中“刚开工三天就放弃”应用“半途而废”，误把两者相混。"},{"t":"choice","q":"这批应聘者素质____，有的很优秀，有的则明显不合格。","a":"参差不齐","d":["良莠不齐","鱼龙混杂","泥沙俱下"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"参差不齐：长短、高低、水平等不一致。句中“有的很优秀，有的明显不合格”说的是水平高低不一，正合此义。易错点：与“良莠不齐”是经典辨析对——后者指好人、坏人混杂在一起，侧重“品质的好坏”，而本句说的是“素质、水平的高低”，故用“参差不齐”；“鱼龙混杂”“泥沙俱下”都比喻好人和坏人混在一起，也不合语境。"},{"t":"choice","q":"他在赠书扉页上写道：“此书不过____，敬请方家指正。”","a":"一家之言","d":["不刊之论","真知灼见","远见卓识"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"一家之言：指有独特见解、自成体系的论著，也常用作谦辞称自己的著作。句中“敬请方家指正”正合自谦之意。易错点：三个干扰项“不刊之论”（不可改动的精当言论）、“真知灼见”（正确深刻的认识）、“远见卓识”（远大的眼光见识）都是高度称颂之辞，用来称自己的书属谦敬错位、褒贬失当。"},{"t":"choice","q":"这届论坛____，各路专家学者云集一堂。","a":"济济一堂","d":["高朋满座","座无虚席","人满为患"],"dt":["对象误用","对象误用","褒贬误用"],"idi":"","m":"对象误用","n":"济济一堂：济济，众多的样子；形容许多有才能的人聚集在一起。句中“各路专家学者云集”正合此义。易错点：该成语专指有才能的人聚集——“高朋满座”形容高贵的朋友很多、宾客满座，侧重宾客身份；“座无虚席”只形容座位坐满，不含“人才”之意；“人满为患”强调人多造成的坏处，是贬义，用于褒扬专家云集属色彩错误。"},{"t":"choice","q":"大家都说这个方案可行，只有他____，认为风险太大。","a":"不以为然","d":["不以为意","不敢苟同","不置可否"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不以为然：然，对、正确；不认为是对的，表示不同意。句中“认为风险太大”正写出他的否定态度。易错点：最易与“不以为意”混淆，后者是“不放在心上”，若误用则把“不同意”变成“不在意”；“不敢苟同”指不敢随便同意，是客气的否定，与“认为风险太大”的直接否定不合；“不置可否”指不表态，是“不说”，而非“不同意”。"},{"t":"judge","q":"这家商场的商品汗牛充栋，应有尽有。","a":"×","d":[],"dt":[],"idi":"汗牛充栋","m":"对象误用","n":"✗ 用法有误。“汗牛充栋”形容书籍极多，只能用于藏书。句中用它形容商品，属对象误用。"},{"t":"judge","q":"他苦心孤诣地策划了这起诈骗案。","a":"×","d":[],"dt":[],"idi":"苦心孤诣","m":"褒贬误用","n":"✗ 用法有误。“苦心孤诣”指费尽心思钻研或经营，达到了别人达不到的境地，是褒义词。句中用它形容策划诈骗，属褒贬误用。"},{"t":"judge","q":"这里路面结冰，他小心翼翼地如履薄冰。","a":"×","d":[],"dt":[],"idi":"如履薄冰","m":"望文生义","n":"✗ 用法有误。“如履薄冰”比喻行事极为谨慎、存有戒心，形容的是人的心态，并非“踩在薄冰上”。句中误把它当作“在冰上行走”，属望文生义。"},{"t":"judge","q":"他发愤图强，终于考上了理想的大学。","a":"√","d":[],"dt":[],"idi":"发愤图强","m":"望文生义","n":"✓ 用法正确。“发愤图强”指振作起来、谋求强盛。句中“终于考上了理想的大学”正合此义。"},{"t":"judge","q":"这篇文章读来楚楚动人，很有感染力。","a":"×","d":[],"dt":[],"idi":"楚楚动人","m":"对象误用","n":"✗ 用法有误。“楚楚动人”形容女子打扮漂亮、姿态娇柔动人，只能用于人。句中用它形容文章，属对象误用。"},{"t":"judge","q":"灯光下，湖面光怪陆离。","a":"√","d":[],"dt":[],"idi":"光怪陆离","m":"望文生义","n":"✓ 用法正确。“光怪陆离”形容光彩奇异、色彩繁杂。句中“灯光下”正合此义。"},{"t":"choice","q":"这套理论曾风行一时，如今早已成了____，少有人再提及。","a":"明日黄花","d":["昨日黄花","历久弥新","方兴未艾"],"dt":["望文生义","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"明日黄花：重阳节一过，赏菊者渐少，比喻已失去应时作用或过时的事物。句中“曾风行一时”“如今少有人提及”正写出“过时”之义。易错点：常被误写误用作“昨日黄花”，且易被望文生义成“明天的花”而误解方向；“历久弥新”指经历长久时间更加鲜活，“方兴未艾”指事物正在兴盛，二者都与“过时”相反。"},{"t":"judge","q":"这个恐怖故事令人毛骨悚然。","a":"√","d":[],"dt":[],"idi":"毛骨悚然","m":"望文生义","n":"✓ 用法正确。“毛骨悚然”形容恐惧惊骇的样子。句中“恐怖故事”正合此义。"},{"t":"judge","q":"他出尔反尔，说话不算数。","a":"√","d":[],"dt":[],"idi":"出尔反尔","m":"望文生义","n":"✓ 用法正确。“出尔反尔”指反复无常、言行前后矛盾。句中“说话不算数”正合此义。"},{"t":"choice","q":"他口若悬河，____，一番话说得大家心悦诚服。","a":"妙语连珠","d":["妙手回春","巧夺天工","栩栩如生"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"妙语连珠：连珠，串珠；巧妙风趣的话一句接一句。句中“口若悬河”“一番话说得大家心悦诚服”正合此义。易错点：该成语用于“话语”——“妙手回春”用于称赞医生的医术，“巧夺天工”形容人工技艺的精巧，“栩栩如生”形容艺术形象的逼真，三者都不能形容“说话”。"},{"t":"choice","q":"老一辈科学家____，在荒滩上建起了第一座实验室。","a":"筚路蓝缕","d":["披星戴月","风餐露宿","含辛茹苦"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"筚路蓝缕：筚路，柴车；蓝缕，破衣服；驾着柴车、穿着破衣去开辟山林，形容创业的艰苦。句中“在荒滩上建起第一座实验室”正是艰苦创业，正合此义。易错点：该成语专指创业的艰辛——“披星戴月”指早出晚归的辛劳，“风餐露宿”指野外或旅途中的食宿艰苦，“含辛茹苦”指忍受辛苦，三者都不含“开创事业”这一特定含义。"},{"t":"choice","q":"珠宝店里各式首饰____，令人目不暇接。","a":"琳琅满目","d":["汗牛充栋","鳞次栉比","栩栩如生"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"琳琅满目：琳琅，精美的玉石；满眼都是美玉，比喻精美的物品或出色的诗文、人才很多。句中写首饰店“各式首饰”，正合此义。易错点：该成语用于精美的物品——“汗牛充栋”只能形容书籍多，“鳞次栉比”只能形容房屋密集排列，“栩栩如生”只能形容艺术形象逼真，三者用于首饰均属对象误用。"},{"t":"choice","q":"大大小小的湖泊____，点缀在辽阔的高原上。","a":"星罗棋布","d":["鳞次栉比","参差不齐","寥寥无几"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"星罗棋布：像星星罗列、棋子分布，形容数量多、分布广。句中写“大大小小的湖泊……点缀在辽阔的高原上”，正合此义。易错点：该成语侧重“散布广”——“鳞次栉比”侧重房屋密集整齐排列，“参差不齐”形容不整齐，“寥寥无几”形容数量极少，三者都与“散布广、数量多”不合。"},{"t":"judge","q":"这个设计别出心裁，令人耳目一新。","a":"√","d":[],"dt":[],"idi":"别出心裁","m":"望文生义","n":"✓ 用法正确。“别出心裁”指独出巧思、不同流俗。句中“耳目一新”正合此义。"},{"t":"judge","q":"有什么困难您尽管说，我一定鼎力相助。","a":"×","d":[],"dt":[],"idi":"鼎力相助","m":"谦敬错位","n":"✗ 用法有误。“鼎力相助”是敬辞，指对方的大力帮助，用于请托或感谢别人，不能用于自己。句中用于自己，属谦敬错位。"},{"t":"choice","q":"老同学来访，主人说：“今日你肯来，真让我这间小屋____，快请进！”","a":"蓬荜生辉","d":["大驾光临","高朋满座","虚左以待"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"蓬荜生辉：蓬荜，蓬门荜户，指贫寒人家的简陋房屋；谦辞，表示由于别人到自己家里来而使自己非常荣幸，只用于自己一方。句中主人指着自己的“小屋”说话，正合此义。易错点：该成语只能用于自己家，说“让您的居室蓬荜生辉”便是错例（等于说对方住的是茅草屋）；“大驾光临”“高朋满座”“虚左以待”都是敬辞，用于称宾客，主人用来指自己一方即成谦敬错位。"},{"t":"judge","q":"他怙恶不悛，屡教不改。","a":"√","d":[],"dt":[],"idi":"怙恶不悛","m":"褒贬误用","n":"✓ 用法正确。“怙恶不悛”指坚持作恶、不肯悔改，是贬义词。句中“屡教不改”正合此义。"},{"t":"judge","q":"他沽名钓誉，欺世盗名。","a":"√","d":[],"dt":[],"idi":"沽名钓誉","m":"褒贬误用","n":"✓ 用法正确。“沽名钓誉”指用某种不正当的手段骗取名誉，是贬义词。句中“欺世盗名”正合此义。"},{"t":"choice","q":"这个机构早已____，形同虚设。","a":"名存实亡","d":["名副其实","名不虚传","名实相副"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"名存实亡：名义上还存在，实际上已经消亡。句中“形同虚设”正合此义。易错点：三个干扰项“名副其实”“名不虚传”“名实相副”都指“名实相符”，与“形同虚设”的名存实亡正好相反。"},{"t":"choice","q":"听闻老校长明日____，我们已把接待事宜安排妥当。","a":"大驾光临","d":["蓬荜生辉","抛砖引玉","虚左以待"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"大驾光临：敬辞，称宾客到来。句中写老校长将要到来、我方安排接待，正合此义。易错点：“蓬荜生辉”是谦辞，只能用于自己家因别人到来而增光，其主体应是“寒舍”而非客人；“抛砖引玉”是谦辞，只能用于自己；“虚左以待”虽为敬辞，但指空着尊位恭候，是等待的行为，不能表示“到来”。"},{"t":"judge","q":"英雄的业绩将流芳百世。","a":"√","d":[],"dt":[],"idi":"流芳百世","m":"望文生义","n":"✓ 用法正确。“流芳百世”指美名流传后世。句中“英雄的业绩”正合此义。"},{"t":"judge","q":"他的怀疑并非空穴来风，而是事出有因。","a":"√","d":[],"dt":[],"idi":"空穴来风","m":"望文生义","n":"✓ 用法正确。“空穴来风”本义是有洞穴才有风进来，比喻消息和传说不是完全没有原因的。句中“并非空穴来风，而是事出有因”正用其本义。"},{"t":"choice","q":"这套百科全书____，天文地理无所不有。","a":"包罗万象","d":["汗牛充栋","美不胜收","星罗棋布"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"包罗万象：包，包括；罗，网罗；形容内容丰富、无所不包。句中写“天文地理无所不有”，正合此义。易错点：该成语侧重“内容丰富、涵盖广”——“汗牛充栋”只形容书籍数量多，不含“内容全面”之意；“美不胜收”多用于景物，“星罗棋布”侧重分布广，三者都不能表达“内容无所不包”。"},{"t":"judge","q":"这款产品在市场上销售不瘟不火。","a":"×","d":[],"dt":[],"idi":"不瘟不火","m":"望文生义","n":"✗ 用法有误。“不瘟不火”指戏曲表演既不沉闷也不过火，多用来形容演员的演技，并非“销售不够火爆、行情平淡”。句中误用来形容商品销售，属对象误用。"},{"t":"judge","q":"他穷困潦倒，死后只落得马革裹尸的结局。","a":"×","d":[],"dt":[],"idi":"马革裹尸","m":"望文生义","n":"✗ 用法有误。“马革裹尸”指用马皮把尸体包裹起来，形容英勇作战、战死沙场，并非“死得很惨、死后连棺材都没有”。句中误把它理解为“死得凄惨”，属望文生义。"},{"t":"judge","q":"新技术的应用如虎添翼，效益倍增。","a":"√","d":[],"dt":[],"idi":"如虎添翼","m":"望文生义","n":"✓ 用法正确。“如虎添翼”比喻强者得到帮助而更加强大。句中“效益倍增”正合此义。"},{"t":"choice","q":"他晚年穷困潦倒，____，靠救济度日。","a":"不名一文","d":["一文不值","无足轻重","腰缠万贯"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"不名一文：名，占有；一文钱都没有，形容极其贫穷。句中“穷困潦倒、靠救济度日”正合此义。易错点：最易被望文生义成“一文不值”（没有价值），把“名”误解为“值钱”；“无足轻重”指无关紧要，不含贫穷义；“腰缠万贯”形容非常富有，与“靠救济度日”正好相反。"},{"t":"choice","q":"他听完专家的分析，连声赞叹：“先生____，令晚辈茅塞顿开。”","a":"真知灼见","d":["一孔之见","雕虫小技","姑妄言之"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"真知灼见：正确而透彻的认识和见解，是称颂他人见解的敬辞色彩表达。句中“令晚辈茅塞顿开”正合称颂之意。易错点：三个干扰项都是谦辞，只能用于称说自己——“一孔之见”用于自己的见解，“雕虫小技”用于自己的技艺，“姑妄言之”用于自己的发言，用来称颂专家的见解属谦敬错位，且含贬低之意。"},{"t":"judge","q":"这个政权穷兵黩武，民不聊生。","a":"√","d":[],"dt":[],"idi":"穷兵黩武","m":"褒贬误用","n":"✓ 用法正确。“穷兵黩武”指出动全部兵力、任意发动战争，形容好战，是贬义词。句中“民不聊生”正合此义。"},{"t":"judge","q":"我这番话不过是班门弄斧，让您见笑了。","a":"√","d":[],"dt":[],"idi":"班门弄斧","m":"谦敬错位","n":"✓ 用法正确。“班门弄斧”比喻在行家面前卖弄本领，是谦辞，用于自己正合适。"},{"t":"judge","q":"本刊将洗心革面，进一步提高稿件质量。","a":"×","d":[],"dt":[],"idi":"洗心革面","m":"对象误用","n":"✗ 用法有误。“洗心革面”指清除坏思想、改变旧面貌，比喻彻底悔改、重新做人，只能用于人，不能用于刊物、机构等事物。句中用它表示刊物改进工作，属对象误用。"},{"t":"judge","q":"为了祖国，他赴汤蹈火也在所不辞。","a":"√","d":[],"dt":[],"idi":"赴汤蹈火","m":"望文生义","n":"✓ 用法正确。“赴汤蹈火”比喻不畏艰险、奋不顾身。句中“在所不辞”正合此义。"},{"t":"choice","q":"这位老师傅钻研数十载，____，再复杂的工艺都游刃有余。","a":"目无全牛","d":["目中无人","一叶障目","胸无点墨"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"目无全牛：眼里看到的不是完整的牛，而是牛体的筋骨结构，形容技艺达到极其纯熟的境界。句中“钻研数十载”“游刃有余”正合此义。易错点：常被望文生义成“没有全局观念、看问题片面”，或把“全牛”误解为“人”而误选“目中无人”（傲慢）、“一叶障目”（被局部现象迷惑）、“胸无点墨”（没有学问）——三者都与“技艺纯熟”无关。"},{"t":"judge","q":"这种新鲜事屡见不鲜，早已见怪不怪。","a":"×","d":[],"dt":[],"idi":"屡见不鲜","m":"望文生义","n":"✗ 用法有误。“屡见不鲜”指多次见到、并不新奇，与“新鲜事”自相矛盾。句中“新鲜事”与“见怪不怪”前后抵触，成语用法与语境不合。"},{"t":"judge","q":"这部老电影如今已鲜为人知，成了明日黄花。","a":"√","d":[],"dt":[],"idi":"明日黄花","m":"望文生义","n":"✓ 用法正确。“明日黄花”比喻已失去应时作用或过时的事物。句中“鲜为人知、成了明日黄花”正合此义。"},{"t":"judge","q":"他沾沾自喜，故步自封。","a":"√","d":[],"dt":[],"idi":"沾沾自喜","m":"褒贬误用","n":"✓ 用法正确。“沾沾自喜”形容自以为不错而得意，是贬义词。句中“故步自封”正合此义。"},{"t":"judge","q":"这批学生的成绩良莠不齐，差别很大。","a":"×","d":[],"dt":[],"idi":"良莠不齐","m":"近义误用","n":"✗ 用法有误。“良莠不齐”指好人、坏人混杂在一起，侧重品质的好坏，不能用来形容“成绩、水平的高低”。句中“成绩差别大”应用“参差不齐”，误把两者相混。"},{"t":"choice","q":"他把珍藏多年的字画拿出来给客人看，说：“这些都是我多年收藏的，____，还望方家指教。”","a":"敝帚自珍","d":["姑妄言之","不吝赐教","一孔之见"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"敝帚自珍：敝，破旧；帚，扫帚；自家的破扫帚也当作宝贝珍惜，比喻东西虽不好，自己却十分珍惜，是谦辞，只用于自己的东西。句中称说自己的藏品，正合此义。易错点：该成语只能用于自己的东西，说别人的东西“敝帚自珍”等于贬低对方；“姑妄言之”是谦辞，指姑且随便说说，用于言论而非藏品；“不吝赐教”是敬辞，方向不符。“一孔之见”是谦辞，指狭隘片面的见解，用于称自己的看法，与称“藏品”的语境不符。"},{"t":"judge","q":"琳琅满目的商品，让人目不暇接。","a":"√","d":[],"dt":[],"idi":"目不暇接","m":"望文生义","n":"✓ 用法正确。“目不暇接”指眼睛来不及看，形容吸引人的东西很多。句中“琳琅满目”正合此义。"},{"t":"judge","q":"这个惊人的消息，让大家目瞪口呆。","a":"√","d":[],"dt":[],"idi":"目瞪口呆","m":"近义误用","n":"✓ 用法正确。“目瞪口呆”形容受惊而愣住的样子。句中“惊人的消息”正合此义。"},{"t":"choice","q":"老中医望闻问切，____，很快找准了病因。","a":"明察秋毫","d":["一丝不苟","小心翼翼","谨小慎微"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"明察秋毫：秋毫，秋天鸟兽新生的细毛；形容目光敏锐，能看清极其细小的事物。句中“望闻问切”“很快找准病因”正合此义。易错点：该成语形容目光、洞察力的敏锐——“一丝不苟”形容做事认真不马虎，“小心翼翼”形容举动十分谨慎，“谨小慎微”指过分小心、缩手缩脚，三者都不含“洞察细微”之意。"},{"t":"choice","q":"沿途的风景____，让人流连忘返。","a":"美不胜收","d":["汗牛充栋","鳞次栉比","济济一堂"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"美不胜收：胜，尽；美好的东西太多，看不过来。句中写“沿途的风景……流连忘返”，正合此义。易错点：该成语多用于景物——“汗牛充栋”只形容书籍多，“鳞次栉比”只形容建筑密集排列，“济济一堂”只形容人才聚集，三者用于风景均属对象误用。"},{"t":"choice","q":"得知您将来我市讲学，我们早已____，只等先生到来。","a":"虚左以待","d":["蓬荜生辉","抛砖引玉","鼎力相助"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"虚左以待：虚，空着；左，古时以左位为尊；空出左边的尊位等待客人，表示尊敬。句中我方恭候先生，正合此义。易错点：“蓬荜生辉”是谦辞，只能用于自己家因别人到来而增光，其主体应是“寒舍”；“抛砖引玉”是谦辞，只用于自己；“鼎力相助”是敬辞，指对方大力帮助，与“恭候”无关。"},{"t":"choice","q":"贪官落马后，其党羽居然____，妄图翻盘。","a":"弹冠相庆","d":["额手称庆","欢欣鼓舞","拍手称快"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"弹冠相庆：弹冠，掸去帽子上的灰尘准备做官；指一人做了官，同伙互相庆贺将有官可做，是贬义词。句中“其党羽……妄图翻盘”正合贬义语境。易错点：该成语只能用于坏人互相庆贺得势，不能用来形容一般的庆贺——“额手称庆”“欢欣鼓舞”“拍手称快”都是褒义或中性的庆贺语，用于“贪官党羽”即成色彩颠倒。"},{"t":"choice","q":"他朗诵时声音____，节奏分明，极富感染力。","a":"抑扬顿挫","d":["栩栩如生","美轮美奂","鳞次栉比"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"抑扬顿挫：指声音的高低起伏、停顿转折，形容声音富有节奏感。句中写“朗诵时声音……节奏分明”，正合此义。易错点：该成语专用于声音的节奏——“栩栩如生”形容艺术形象，“美轮美奂”只用于房屋建筑，“鳞次栉比”只用于建筑排列，三者都不能形容声音。"},{"t":"judge","q":"他附庸风雅，装点门面。","a":"√","d":[],"dt":[],"idi":"附庸风雅","m":"望文生义","n":"✓ 用法正确。“附庸风雅”指为了装点门面而结交名士、从事文化活动，含贬义。句中“装点门面”正合此义。"},{"t":"judge","q":"中国队河东狮吼，一举夺冠。","a":"×","d":[],"dt":[],"idi":"河东狮吼","m":"望文生义","n":"✗ 用法有误。“河东狮吼”比喻悍妒的妻子对丈夫发怒，并非“雄狮发威、气势雄壮”。句中把“河东狮吼”误作“东方睡狮醒来发威”，既望文生义，又用错了对象和感情色彩。"},{"t":"judge","q":"他在比赛中大显身手。","a":"√","d":[],"dt":[],"idi":"大显身手","m":"望文生义","n":"✓ 用法正确。“大显身手”指充分显示出本领才能。句中“在比赛中”正合此义。"},{"t":"judge","q":"身处逆境，他却能安之若素。","a":"√","d":[],"dt":[],"idi":"安之若素","m":"望文生义","n":"✓ 用法正确。“安之若素”指身处逆境、遇到困难或遭受挫折时能泰然处之、跟平常一样。句中“身处逆境……安之若素”正合此义。"},{"t":"choice","q":"面对旁人的善意提醒，他____，结果一错再错。","a":"不以为意","d":["不以为然","不以为耻","不闻不问"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不以为意：不把它放在心上，表示轻视、不在意。句中“结果一错再错”正说明他没把提醒当回事。易错点：与“不以为然”是高考必考的一对——“不以为然”指不认为是对的（含否定、不同意），“不以为意”指不放在心上（含轻视、疏忽），本句是“听了却没当回事”，故用“不以为意”；“不闻不问”指既不听也不问，形容漠不关心。“不以为耻”指不把某事当作耻辱，与“不在意提醒”完全不同；“不闻不问”指漠不关心，也不合。"},{"t":"judge","q":"这起真实的惨案耸人听闻，令人震惊。","a":"×","d":[],"dt":[],"idi":"耸人听闻","m":"近义误用","n":"✗ 用法有误。“耸人听闻”指故意夸大或捏造事实使人震惊，含主观故意；“真实的惨案”是客观事实，应用“骇人听闻”。句中误把两者相混。"},{"t":"judge","q":"他一蹴而就地写完了这篇论文。","a":"×","d":[],"dt":[],"idi":"一蹴而就","m":"望文生义","n":"✗ 用法有误。“一蹴而就”指踏一步就成功，形容事情轻而易举、一下子就能完成，多用于否定或强调“不可轻易成功”，不能等同于“一气呵成”地快速完成。句中误把它当作“一挥而就、快速写完”，属望文生义。"},{"t":"choice","q":"主持人说：“下面请王老讲话，大家____。”","a":"洗耳恭听","d":["姑妄言之","抛砖引玉","敬谢不敏"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"洗耳恭听：洗清耳朵，恭敬地听，形容恭敬而认真地听人讲话，多用于请人讲话时的客气话。句中“请王老讲话”正是请众人恭敬聆听，正合此义。易错点：三个干扰项都是谦辞——“姑妄言之”用于自己随便说说，“抛砖引玉”用于自己先发言，“敬谢不敏”用于自己推辞，都不能表示“恭敬地听”。"},{"t":"judge","q":"老师举一反三，讲解透彻。","a":"√","d":[],"dt":[],"idi":"举一反三","m":"望文生义","n":"✓ 用法正确。“举一反三”指从一件事类推而知道许多同类事理。句中“讲解透彻”正合此义。"},{"t":"judge","q":"他粗茶淡饭，生活十分简朴。","a":"√","d":[],"dt":[],"idi":"粗茶淡饭","m":"望文生义","n":"✓ 用法正确。“粗茶淡饭”形容饮食简单、生活简朴。句中“生活十分简朴”正合此义。"},{"t":"choice","q":"这幅画____，构思别具一格。","a":"匠心独运","d":["栩栩如生","美轮美奂","妙手回春"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"匠心独运：匠心，巧妙的心思；创造性地运用精巧的心思，多指文学艺术的创作构思。句中“构思别具一格”正合此义。易错点：该成语侧重“构思巧妙”——“栩栩如生”形容形象逼真，“美轮美奂”只用于建筑，“妙手回春”只用于医术，三者都不能表达“构思”之义。"},{"t":"judge","q":"他恣意妄为，目无法纪。","a":"√","d":[],"dt":[],"idi":"恣意妄为","m":"褒贬误用","n":"✓ 用法正确。“恣意妄为”指肆意为非作歹，是贬义词。句中“目无法纪”正合此义。"},{"t":"judge","q":"所谓的前景不过是海市蜃楼。","a":"√","d":[],"dt":[],"idi":"海市蜃楼","m":"望文生义","n":"✓ 用法正确。“海市蜃楼”比喻虚幻的事物。句中“不过是”正合此义。"},{"t":"judge","q":"他心有余而力不足，只能望洋兴叹。","a":"√","d":[],"dt":[],"idi":"望洋兴叹","m":"近义误用","n":"✓ 用法正确。“望洋兴叹”原指仰望海神而叹息，后比喻因力量不足或没有条件而感到无可奈何。句中“心有余而力不足”正合此义。"},{"t":"judge","q":"他居心叵测，不可不防。","a":"√","d":[],"dt":[],"idi":"居心叵测","m":"褒贬误用","n":"✓ 用法正确。“居心叵测”指存心险恶、难以推测，是贬义词。句中“不可不防”正合此义。"},{"t":"judge","q":"你身为师傅的入室弟子，真是忝列门墙。","a":"×","d":[],"dt":[],"idi":"忝列门墙","m":"谦敬错位","n":"✗ 用法有误。“忝列门墙”是谦辞，“忝”是“辱没”之意，表示自己愧列其中，只能用于自己。句中用它称说对方，属谦敬错位。"},{"t":"judge","q":"他任劳任怨，从不计较个人得失。","a":"√","d":[],"dt":[],"idi":"任劳任怨","m":"望文生义","n":"✓ 用法正确。“任劳任怨”指做事不怕辛苦、不怕别人埋怨。句中“不计较个人得失”正合此义。"},{"t":"judge","q":"他对工作墨守成规，缺乏创新。","a":"√","d":[],"dt":[],"idi":"墨守成规","m":"望文生义","n":"✓ 用法正确。“墨守成规”指拘泥于旧规、不求改进。句中“缺乏创新”正合此义。"},{"t":"judge","q":"这个人蛮不讲理，简直不可思议。","a":"×","d":[],"dt":[],"idi":"不可思议","m":"望文生义","n":"✗ 用法有误。“不可思议”指不可想象、不能理解，多含神秘奥妙之意，不能用来形容“蛮不讲理”。句中误把它当作“不可理喻”，属望文生义。"},{"t":"judge","q":"公园里摆放的各种菊花姹紫嫣红，风姿绰约。","a":"×","d":[],"dt":[],"idi":"风姿绰约","m":"对象误用","n":"✗ 用法有误。“风姿绰约”形容女子姿态柔美，只能用于人，不能用来形容花木。句中用它描写菊花，属对象误用。"},{"t":"judge","q":"他把祖传的古董暴殄天物般珍藏起来。","a":"×","d":[],"dt":[],"idi":"暴殄天物","m":"望文生义","n":"✗ 用法有误。“暴殄天物”原指残害灭绝自然之物，后泛指任意糟蹋、浪费物品，并非“珍视宝物”。句中误把它当作“珍爱惜物”，属望文生义。"},{"t":"judge","q":"我这点见识，恐怕要贻笑大方了。","a":"√","d":[],"dt":[],"idi":"贻笑大方","m":"谦敬错位","n":"✓ 用法正确。“贻笑大方”指让内行人笑话，是谦辞，用于自己正合适。"},{"t":"judge","q":"他每天在花园里指手画脚地练动作，抑扬顿挫地背台词。","a":"×","d":[],"dt":[],"idi":"指手画脚","m":"望文生义","n":"✗ 用法有误。“指手画脚”现多指不负责任地乱加指点、批评，或任意发号施令，并非“一边说话一边做手势”。句中误把它当作“比划动作”，属望文生义。"},{"t":"judge","q":"听了他的解释，我心中的疑虑涣然冰释。","a":"√","d":[],"dt":[],"idi":"涣然冰释","m":"望文生义","n":"✓ 用法正确。“涣然冰释”比喻疑虑、误会等一下子完全消除。句中“疑虑”正合此义。"},{"t":"judge","q":"这个犯罪团伙东山再起，重操旧业。","a":"×","d":[],"dt":[],"idi":"东山再起","m":"褒贬误用","n":"✗ 用法有误。“东山再起”比喻再度任职，或失败后重新兴起，是褒义词。句中用它形容犯罪团伙重操旧业，属褒贬误用。"},{"t":"choice","q":"面对大家的夸奖，他____地连连摆手：“我这点成绩算不了什么，都是团队的功劳。”","a":"受宠若惊","d":["当之无愧","当仁不让","虚怀若谷"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"受宠若惊：得到意外的宠爱或夸奖而惊喜不安，是客套话，用于自己承受不起对方的夸奖时。句中“连连摆手”“算不了什么”正合自谦之意。易错点：“当之无愧”指当得起某种荣誉、毫无愧色，“当仁不让”指遇到该做的事主动承担，二者都表示自己配得上、不推辞，与自谦矛盾；“虚怀若谷”是带敬辞色彩的褒义成语，用于称颂他人谦虚，不能用于自己。"},{"t":"choice","q":"画家指着墙上的习作对客人说：“这些都是我____的东西，不成样子，见笑了。”","a":"信笔涂鸦","d":["妙手偶得","一挥而就","匠心独运"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"信笔涂鸦：形容书法拙劣或胡乱写作，是谦辞，只用于称自己的作品。句中画家指着自己的习作自谦，正合此义。易错点：三个干扰项“妙手偶得”（文学素养深的人偶然得到佳句）、“一挥而就”（写字作文画画很快完成）、“匠心独运”（创造性地运用精巧心思）都是褒义成语，用来自谦自己的习作既属谦敬错位，又与“不成样子”矛盾。"},{"t":"choice","q":"他事业有成，____，对前途充满信心。","a":"踌躇满志","d":["沾沾自喜","得意忘形","自鸣得意"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"踌躇满志：踌躇，从容自得的样子；形容心满意足、从容自得，是褒义词。句中“事业有成”“对前途充满信心”正合褒义语境。易错点：常被误当作贬义，与“沾沾自喜”（自以为不错而得意）、“得意忘形”“自鸣得意”（得意的神态，均贬义）相混——后者强调“浅薄的得意”，而“踌躇满志”是正当的自信与满足。"},{"t":"judge","q":"他安步当车，慢慢走回了家。","a":"√","d":[],"dt":[],"idi":"安步当车","m":"望文生义","n":"✓ 用法正确。“安步当车”指以从容的步行代替乘车。句中“慢慢走回了家”正合此义。"},{"t":"judge","q":"这位学者满腹经纶，学富五车。","a":"√","d":[],"dt":[],"idi":"满腹经纶","m":"望文生义","n":"✓ 用法正确。“满腹经纶”形容人很有才学和智谋。句中“学富五车”正合此义。"},{"t":"choice","q":"失败并不可怕，关键是能否____，重新出发。","a":"重整旗鼓","d":["卷土重来","死灰复燃","一蹶不振"],"dt":["褒贬误用","褒贬误用","语义矛盾"],"idi":"","m":"褒贬误用","n":"重整旗鼓：失败之后重新集合力量再来，是褒义词。句中“失败并不可怕”“重新出发”正合褒义语境。易错点：该成语用于褒义的“重振”——“卷土重来”“死灰复燃”都是贬义，指恶势力重新活动、坏事再次发生，色彩与“救人/再出发”的积极语境相反；“一蹶不振”指一跌倒就再也爬不起来，与“重新出发”语义直接矛盾，是明显的错项。"},{"t":"choice","q":"他是这场歪风邪气的____，必须严肃查处。","a":"始作俑者","d":["开山鼻祖","功不可没","居功至伟"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"始作俑者：俑，古代殉葬的偶人；比喻某种坏事或恶劣风气的创始者，是贬义词。句中“歪风邪气……严肃查处”正合贬义语境。易错点：该成语只能指坏风气的开创者——“开山鼻祖”指某一学派的创始人（中性偏褒），“功不可没”“居功至伟”都是褒义，用于“严肃查处”的对象即色彩颠倒。"},{"t":"judge","q":"使用本产品，让您的居室蓬荜生辉。","a":"×","d":[],"dt":[],"idi":"蓬荜生辉","m":"谦敬错位","n":"✗ 用法有误。“蓬荜生辉”是谦辞，表示别人到自己家来或题赠字画使自己家增添光辉，只能用于自己一方。广告语把它用于“您的居室”，属谦敬错位。"},{"t":"judge","q":"这位男青年正值豆蔻年华，意气风发。","a":"×","d":[],"dt":[],"idi":"豆蔻年华","m":"对象误用","n":"✗ 用法有误。“豆蔻年华”专指女子十三四岁的年纪，既有性别限制又有年龄限制。句中用它形容男青年，属对象误用。"},{"t":"judge","q":"我姑妄言之，您姑妄听之。","a":"√","d":[],"dt":[],"idi":"姑妄言之","m":"谦敬错位","n":"✓ 用法正确。“姑妄言之”指姑且随便说说，是谦辞。句中用于自己“随便说说”，正合适。"},{"t":"judge","q":"敌军风声鹤唳，草木皆兵。","a":"√","d":[],"dt":[],"idi":"风声鹤唳","m":"望文生义","n":"✓ 用法正确。“风声鹤唳”形容惊慌疑惧、自相惊扰。句中“草木皆兵”正合此义。"},{"t":"judge","q":"他信手拈来，出口成章。","a":"√","d":[],"dt":[],"idi":"信手拈来","m":"望文生义","n":"✓ 用法正确。“信手拈来”指随手拿来，多形容写文章时能熟练地运用材料、不用思考。句中“出口成章”正合此义。"},{"t":"choice","q":"他沉迷手机游戏荒废了学业，这种做法____，同学们应当引以为戒。","a":"不足为训","d":["不足为奇","乏善可陈","情有可原"],"dt":["望文生义","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"不足为训：训，法则、准则；不值得作为效法的准则或典范。句中“引以为戒”正说明此事是不能效法的反面例子，语义吻合。易错点：常被望文生义成“不值得作为教训”，把“训”误作“教训”；“不足为奇”指不值得奇怪，与“引以为戒”无关；“乏善可陈”指没有什么优点值得称道，是贬义；“情有可原”指按情理可以原谅，与“引以为戒”的否定态度正好相反。"},{"t":"judge","q":"他待人冷漠、见死不救，真是木人石心。","a":"×","d":[],"dt":[],"idi":"木人石心","m":"望文生义","n":"✗ 用法有误。“木人石心”比喻人意志坚定、不为外物所动，是褒义，并非“铁石心肠、麻木无情”。句中把它误解成“冷酷无情”，属望文生义。"},{"t":"choice","q":"他____，能把黑的说成白的，令人防不胜防。","a":"巧舌如簧","d":["能言善辩","口若悬河","滔滔不绝"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"巧舌如簧：舌头灵巧得像簧片，形容能说会道、善于狡辩，是贬义词。句中“能把黑的说成白的”正合贬义语境。易错点：该成语侧重“狡辩、花言巧语”的贬义——“能言善辩”“口若悬河”“滔滔不绝”都侧重口才好、健谈，是褒义或中性，用于“颠倒黑白”即失当。"},{"t":"choice","q":"他只会____，没有半点真才实学。","a":"夸夸其谈","d":["侃侃而谈","娓娓道来","头头是道"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"夸夸其谈：形容说话浮夸、不切实际，是贬义词。句中“没有半点真才实学”正合贬义语境。易错点：与褒义的“侃侃而谈”相对；“娓娓道来”形容生动动听地讲述，“头头是道”形容说话做事很有条理，二者都是褒义，用于“没有真才实学”即成色彩颠倒。"},{"t":"judge","q":"这篇论文旁征博引，令人信服。","a":"√","d":[],"dt":[],"idi":"旁征博引","m":"望文生义","n":"✓ 用法正确。“旁征博引”指广泛地引用材料作为依据、例证。句中用来形容论文引证丰富，正合此义。"},{"t":"judge","q":"他对下属颐指气使，作威作福。","a":"√","d":[],"dt":[],"idi":"颐指气使","m":"褒贬误用","n":"✓ 用法正确。“颐指气使”形容有势力的人傲慢地支使别人，是贬义词。句中“作威作福”正合此义。"},{"t":"choice","q":"国庆假期，前来游览的游客____，把景区挤得水泄不通。","a":"络绎不绝","d":["门可罗雀","鸦雀无声","寥寥无几"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"络绎不绝：络绎，前后相接、连续不断；形容人马车船等前后相接、连续不断。句中“前来游览的游客……把景区挤得水泄不通”正合此义。易错点：该成语形容人车马船的连续不断——“门可罗雀”形容门前冷落、宾客稀少，“鸦雀无声”形容非常安静，“寥寥无几”形容数量极少，三者都与“挤得水泄不通”的人流如织正好相反。"},{"t":"choice","q":"新落成的美术馆____，外观气势恢宏，引来无数参观者。","a":"美轮美奂","d":["栩栩如生","绘声绘色","妙趣横生"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"美轮美奂：轮，高大；奂，众多；形容房屋高大华美，也形容装饰布置美好漂亮。句中写美术馆建筑，正合此义。易错点：该成语只能用于房屋建筑及其装饰——“栩栩如生”用于画中、塑像等艺术形象，“绘声绘色”用于描写叙述，“妙趣横生”用于话语、诗文，三者都不能形容建筑物。"},{"t":"judge","q":"这个观点曲高和寡，知音难觅。","a":"√","d":[],"dt":[],"idi":"曲高和寡","m":"望文生义","n":"✓ 用法正确。“曲高和寡”比喻言论或作品高雅、不为人理解。句中“知音难觅”正合此义。"},{"t":"choice","q":"这个道理人人都懂，可真正____的人却不多。","a":"身体力行","d":["夸夸其谈","纸上谈兵","坐而论道"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"身体力行：亲身体验、努力实行。句中“道理人人都懂，可真正……的人不多”正强调“亲自去做”之难得。易错点：三个干扰项“夸夸其谈”（说话浮夸不切实际）、“纸上谈兵”（空谈理论不能解决实际问题）、“坐而论道”（空谈大道理）都是只说不做的贬义成语，与“真正实行”正好相反，句末“人却不多”的转折决定了此处必须选一个褒义的“实干”成语。"},{"t":"judge","q":"敌人重整旗鼓，卷土重来。","a":"×","d":[],"dt":[],"idi":"重整旗鼓","m":"褒贬误用","n":"✗ 用法有误。“重整旗鼓”比喻失败后重新集合力量再来，是褒义词，多用于己方。句中用它形容“敌人卷土重来”，属褒贬误用，应说“死灰复燃”“卷土重来”。"},{"t":"choice","q":"他____，待人真诚，大家都愿意和他交朋友。","a":"胸无城府","d":["胸无点墨","不学无术","老谋深算"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"胸无城府：城府，比喻待人处事的心机；形容为人坦率真诚、没有心机，是褒义词。句中“待人真诚”正合褒义语境。易错点：最易被望文生义成“没有谋略、头脑简单”，从而误选“胸无点墨”（没有学问）、“不学无术”（没有学问本领）、“老谋深算”（深于谋略）——三者都与“真诚坦率”的褒义不合。"},{"t":"judge","q":"这件作品整体很好，只有一点白璧微瑕。","a":"√","d":[],"dt":[],"idi":"白璧微瑕","m":"望文生义","n":"✓ 用法正确。“白璧微瑕”比喻很好的人或事物还有小缺点。句中“整体很好，只有一点……”正合此义。"},{"t":"judge","q":"他按部就班地完成了各项任务。","a":"√","d":[],"dt":[],"idi":"按部就班","m":"望文生义","n":"✓ 用法正确。“按部就班”指按照一定的条理、遵循一定的程序。句中“完成了各项任务”正合此义。"},{"t":"choice","q":"这部小说出版后风靡一时，____，出版社接连加印。","a":"洛阳纸贵","d":["汗牛充栋","美轮美奂","鳞次栉比"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"洛阳纸贵：晋代左思写成《三都赋》，人们争相传抄，洛阳的纸因此涨价；比喻著作广泛流传、风行一时。句中“风靡一时”“接连加印”正合此义。易错点：该成语描述的是“著作风行一时、争相传抄”的局面，陈述对象是流传的盛况——“汗牛充栋”只形容藏书多，“美轮美奂”只用于房屋建筑，“鳞次栉比”只用于建筑物密集排列，三者都不能表达“著作风行、洛阳纸贵”的轰动局面。"},{"t":"judge","q":"这篇小说的写法不落窠臼。","a":"√","d":[],"dt":[],"idi":"不落窠臼","m":"望文生义","n":"✓ 用法正确。“不落窠臼”比喻有独创风格、不落俗套。句中“写法”正合此义。"},{"t":"judge","q":"这位慈善家一生善举擢发难数。","a":"×","d":[],"dt":[],"idi":"擢发难数","m":"对象误用","n":"✗ 用法有误。“擢发难数”形容罪行多得数不清，只能用于罪恶，不能用于善举。句中用它形容“善举”，属对象误用。"},{"t":"choice","q":"他听完全程一言不发，____，没有发表任何意见。","a":"不赞一词","d":["赞不绝口","不以为然","深表赞同"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"不赞一词：原指文章写得好、别人不能再添一句话，现多指一言不发。句中“一言不发”“没有发表任何意见”正合此义。易错点：最易被望文生义成“不说一句赞成的话”，把“赞”误解为“赞成”，一误解就会错选“赞不绝口”（不住地称赞）、“深表赞同”；“不以为然”指不认为是对的，与“一言不发”是两回事。"},{"t":"choice","q":"市中心大道____，车来人往，热闹非凡。","a":"车水马龙","d":["门可罗雀","人山人海","摩肩接踵"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"车水马龙：车像流水、马像游龙，形容车马来往不绝的繁华景象。句中“车来人往”正合此义。易错点：该成语的主体是车马，强调交通的繁忙——“门可罗雀”形容门前冷落、宾客稀少，与“热闹非凡”正好相反；“人山人海”形容聚集的人极多，“摩肩接踵”形容人多拥挤，二者只写“人多”，不能体现“车马来往”的繁华交通。"},{"t":"judge","q":"对同一部作品，大家见仁见智，评价不一。","a":"√","d":[],"dt":[],"idi":"见仁见智","m":"望文生义","n":"✓ 用法正确。“见仁见智”指对同一个问题各人有各人的见解。句中“评价不一”正合此义。"},{"t":"judge","q":"这种小商品遍地都是，堪称凤毛麟角。","a":"×","d":[],"dt":[],"idi":"凤毛麟角","m":"对象误用","n":"✗ 用法有误。“凤毛麟角”比喻珍贵而稀少的人或事物，与“遍地都是”正好矛盾。句中用它形容常见的小商品，属语义矛盾。"},{"t":"judge","q":"歹徒肆无忌惮，横行乡里。","a":"√","d":[],"dt":[],"idi":"肆无忌惮","m":"褒贬误用","n":"✓ 用法正确。“肆无忌惮”指毫无顾忌、任意妄为，是贬义词。句中“横行乡里”正合此义。"},{"t":"choice","q":"听说超市免费派发礼品，众人____，把门口围得水泄不通。","a":"趋之若鹜","d":["纷至沓来","络绎不绝","接踵而至"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"趋之若鹜：像鸭子一样成群地跑过去，比喻很多人争相追逐某种事物，多含贬义。句中“听说有免费礼品”“围得水泄不通”带盲目追逐色彩，正合贬义语境。易错点：“纷至沓来”“络绎不绝”“接踵而至”都是中性成语，形容接连到来，不含“盲目追逐”的贬义，若句中不含批评意味则可用，但此处强调盲从哄抢，须用贬义。"},{"t":"judge","q":"花这么大的代价去换这点收益，实在得不偿失。","a":"√","d":[],"dt":[],"idi":"得不偿失","m":"望文生义","n":"✓ 用法正确。“得不偿失”指得到的抵不上付出的。句中“花大代价换小收益”正合此义。"},{"t":"judge","q":"大街上车辆川流不息。","a":"√","d":[],"dt":[],"idi":"川流不息","m":"望文生义","n":"✓ 用法正确。“川流不息”形容行人、车马等像水流一样连续不断。句中“车辆”正合此义。"},{"t":"choice","q":"他拦住门卫恳求道：“这事是我一时糊涂，还请您____。”","a":"高抬贵手","d":["抛砖引玉","聊表寸心","敝帚自珍"],"dt":["谦敬错位","谦敬错位","谦敬错位"],"idi":"","m":"谦敬错位","n":"高抬贵手：贵手，尊贵的手；客套话，多用于请求对方饶恕或通融。句中“这事是我一时糊涂”“请您……”正是恳请对方通融，正合此义。易错点：三个干扰项都是谦辞，用于称说自己——“抛砖引玉”用于自己先发言，“聊表寸心”用于自己送礼，“敝帚自珍”用于自己的东西，都不能用来恳请对方。"},{"t":"judge","q":"我们要身临其境地为灾区群众着想。","a":"×","d":[],"dt":[],"idi":"身临其境","m":"近义误用","n":"✗ 用法有误。“身临其境”指亲身到了那个境地，不能表示“替别人着想”。句中要表达“设身处地替人着想”，应用“设身处地”，属近义误用。"},{"t":"choice","q":"他的建议与我的想法____，我们几乎同时提出。","a":"不谋而合","d":["不约而同","异口同声","殊途同归"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不谋而合：谋，商量；没有事先商量而彼此的见解或计划完全一致。句中“建议与我的想法”是见解的一致，正合此义。易错点：与“不约而同”是经典辨析对——前者多指见解、主张一致，可作谓语；后者多指行动一致，一般作状语；“异口同声”指大家说得一样，“殊途同归”指方法不同而结果相同，均不合语境。"},{"t":"judge","q":"他委曲求全，勉强答应了对方的条件。","a":"√","d":[],"dt":[],"idi":"委曲求全","m":"望文生义","n":"✓ 用法正确。“委曲求全”指勉强迁就以求保全。句中“勉强答应”正合此义。"},{"t":"judge","q":"这是一部鸿篇巨制，规模宏大。","a":"√","d":[],"dt":[],"idi":"鸿篇巨制","m":"望文生义","n":"✓ 用法正确。“鸿篇巨制”指篇幅长、规模大的著作。句中“规模宏大”正合此义。"},{"t":"choice","q":"这个恶霸____，什么坏事都干得出来，最终锒铛入狱。","a":"无所不为","d":["无微不至","无所不能","无所不有"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"无所不为：为，做；没有什么事不做，指什么坏事都干，是贬义词。句中“什么坏事都干得出来”正合贬义语境。易错点：该成语只用于贬义——“无微不至”形容关怀周到（褒），“无所不能”指什么都会、神通广大（褒），“无所不有”指什么都有（中性），三者与“干坏事”完全不合。"},{"t":"judge","q":"对坏人坏事绝不能姑息养奸。","a":"√","d":[],"dt":[],"idi":"姑息养奸","m":"褒贬误用","n":"✓ 用法正确。“姑息养奸”指无原则地宽容而助长坏人坏事，是贬义词。句中“绝不能……”正合此义。"},{"t":"judge","q":"欢迎张教授抛砖引玉，为我们分享高见。","a":"×","d":[],"dt":[],"idi":"抛砖引玉","m":"谦敬错位","n":"✗ 用法有误。“抛砖引玉”是谦辞，比喻用自己粗浅的意见引出别人高明的意见，只能用于自己。句中用在张教授身上，属谦敬错位。"},{"t":"judge","q":"看到小丑的表演，大家忍俊不禁地笑了起来。","a":"×","d":[],"dt":[],"idi":"忍俊不禁","m":"望文生义","n":"✗ 用法有误。“忍俊不禁”指忍不住发笑，本身已含“笑”的意思，不能再说“忍俊不禁地笑了起来”，否则语义重复。应说“忍俊不禁”或“忍不住笑了起来”。"},{"t":"judge","q":"他破釜沉舟，决意背水一战。","a":"√","d":[],"dt":[],"idi":"破釜沉舟","m":"望文生义","n":"✓ 用法正确。“破釜沉舟”比喻下定决心、不顾一切干到底。句中“背水一战”正合此义。"},{"t":"judge","q":"他博闻强识，学贯中西。","a":"√","d":[],"dt":[],"idi":"博闻强识","m":"望文生义","n":"✓ 用法正确。“博闻强识”指见闻广博、记忆力强。句中“学贯中西”正合此义。"},{"t":"choice","q":"他借走我的书半年未还，____，催了好几次也没动静。","a":"久假不归","d":["久别重逢","泥牛入海","杳无音信"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"久假不归：假，借；长期借用而不归还。句中“借走半年未还”“催了好几次”正照应“久借不还”。易错点：最易被望文生义成“请了长假不回来”，把“假”误作“假期”；“久别重逢”指久别后再次相见，“泥牛入海”“杳无音信”都比喻一去不返、没有消息，多用于人或音信，不能表示“借物不还”。"},{"t":"choice","q":"他助人为乐、诚实守信，这些行为本身是____的。","a":"无可非议","d":["无可厚非","情有可原","无可挑剔"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"无可非议：非议，批评指责；没有什么可以指责的，指言行完全正确、合情合理。句中“助人为乐、诚实守信”是完全正确的好事，正合此义。易错点：与“无可厚非”（虽有缺点但可谅解）程度不同——好事没有缺点，故用“无可非议”；“情有可原”指按情理有可原谅的地方，也暗示“原本有错”，不合语境。“无可挑剔”指挑不出毛病，与“无可非议”近义，但本句说的是“行为的正当性”，故用“无可非议”。"},{"t":"judge","q":"这些贪官草菅人命，罪大恶极。","a":"√","d":[],"dt":[],"idi":"草菅人命","m":"望文生义","n":"✓ 用法正确。“草菅人命”指把人命当作野草一样，任意残害。句中“罪大恶极”正合此义。"},{"t":"choice","q":"这部电影整体平庸，但几位配角的表演还算____，值得一看。","a":"差强人意","d":["不尽如人意","尽善尽美","令人失望"],"dt":["望文生义","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"差强人意：差，稍微、大致；大体上还能使人满意。句中“整体平庸”与“还算……值得一看”的转折，正写出“勉强令人满意”之义。易错点：最易被望文生义成“不能令人满意”，恰好用反，一旦误解就会错选“不尽如人意”“令人失望”；“尽善尽美”指完美无缺，与“整体平庸”的前提矛盾。"},{"t":"choice","q":"敌人不甘心失败，正在____，企图卷土重来。","a":"蠢蠢欲动","d":["跃跃欲试","摩拳擦掌","整装待发"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"蠢蠢欲动：蠢蠢，虫子蠕动的样子；比喻敌人或坏分子准备进行活动，是贬义词。句中“敌人……企图卷土重来”正合贬义语境。易错点：该成语只能用于敌人、坏分子——“跃跃欲试”“摩拳擦掌”“整装待发”都形容急切想行动、准备就绪，是中性或褒义，用于“敌人”虽也可通，但丧失了对敌的贬斥色彩。"},{"t":"choice","q":"上面作风不正，下面自然____，歪风迅速蔓延。","a":"上行下效","d":["以身作则","率先垂范","言传身教"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"褒贬误用","n":"上行下效：上面的人怎么做，下面的人就跟着怎么学，多指跟着学坏，是贬义词。句中“作风不正”“歪风蔓延”正合贬义语境。易错点：该成语常被误当作褒义词，用来表示“群众以干部为榜样”，属高考反复考查的褒贬误用；若句中是褒扬干部带头，则应用“以身作则”“率先垂范”“言传身教”。"},{"t":"judge","q":"他面对选择，期期艾艾，犹豫不决。","a":"×","d":[],"dt":[],"idi":"期期艾艾","m":"望文生义","n":"✗ 用法有误。“期期艾艾”形容人口吃、说话不流利，并非“犹犹豫豫”。句中误把它当作“犹豫不决”，属望文生义。"},{"t":"choice","q":"他____，一句话就点破了问题的实质。","a":"一针见血","d":["开门见山","单刀直入","直截了当"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"一针见血：比喻话说得简短而能切中要害。句中“一句话点破问题的实质”正合此义。易错点：该成语强调的是“切中要害”的效果——“开门见山”指说话写文章一开头就进入正题，侧重开篇方式；“单刀直入”“直截了当”都侧重说话办事的爽快直接，三者都不含“切中要害”之意。"},{"t":"choice","q":"这家百年老店重新开张后____，顾客盈门，生意兴隆。","a":"门庭若市","d":["门可罗雀","鸦雀无声","冷冷清清"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"门庭若市：门前和院子里像集市一样，形容来往的人很多、非常热闹。句中“顾客盈门、生意兴隆”正合此义。易错点：该成语形容门前热闹——“门可罗雀”形容门前冷落、宾客稀少，“鸦雀无声”形容非常安静，“冷冷清清”形容冷落萧条，三者都与“生意兴隆”相反。"},{"t":"judge","q":"老张一家三代和睦相处，举案齐眉。","a":"×","d":[],"dt":[],"idi":"举案齐眉","m":"对象误用","n":"✗ 用法有误。“举案齐眉”形容夫妻互敬互爱，只能用于夫妻之间。句中用它形容“一家三代”，属对象误用。"},{"t":"judge","q":"他把人物的心理刻画得淋漓尽致。","a":"√","d":[],"dt":[],"idi":"淋漓尽致","m":"望文生义","n":"✓ 用法正确。“淋漓尽致”形容表达得详尽透彻、充分彻底。句中“刻画得”正合此义。"},{"t":"choice","q":"这部纪实作品写尽人间惨状，读来令人____。","a":"不忍卒读","d":["不堪入目","无病呻吟","味同嚼蜡"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"不忍卒读：卒，尽、完；不忍心读完，多形容文章内容悲惨动人。句中“写尽人间惨状”正合此义。易错点：最易被望文生义成“文章写得不好、不忍心读下去”，从而误选“不堪入目”（形容脏乱难看）、“无病呻吟”（作品矫揉造作、缺乏真情）、“味同嚼蜡”（毫无味道）——三者都是贬义，与“悲惨动人”的色彩完全相反。"},{"t":"choice","q":"这部作品语言通俗、贴近大众，属于典型的____之作。","a":"下里巴人","d":["阳春白雪","曲高和寡","高山流水"],"dt":["褒贬误用","褒贬误用","褒贬误用"],"idi":"","m":"望文生义","n":"下里巴人：战国时楚国流行的通俗歌曲，后泛指通俗的文学艺术。句中“语言通俗、贴近大众”正合此义。易错点：常被望文生义成“普通的乡下人”，且易与表示高雅文艺的“阳春白雪”相混；“曲高和寡”指曲调高深、能跟着唱的人少，比喻作品高雅不易被理解；“高山流水”比喻知音或乐曲高妙，三者都指“高雅”，与“通俗”正好相反。"},{"t":"choice","q":"此人一生____，为人正直，从不阿谀奉承。","a":"危言危行","d":["危言耸听","谨言慎行","胆小怕事"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"危言危行：危，正直；说正直的话、做正直的事。句中“为人正直，从不阿谀”正合此义。易错点：最易把“危”望文生义成“危险”，从而误选“危言耸听”（故意说吓人的话使人震惊）；“谨言慎行”指言语行动小心谨慎，侧重“谨慎”而非“正直”；“胆小怕事”指胆子小、怕惹事，与“从不阿谀”的正直品性相反。"},{"t":"judge","q":"寒风中，同学们衣衫单薄，一个个噤若寒蝉。","a":"×","d":[],"dt":[],"idi":"噤若寒蝉","m":"望文生义","n":"✗ 用法有误。“噤若寒蝉”的“噤”是“闭口不言”之意，指人因害怕或有顾虑而不敢作声，与“寒冷”无关。句中误把它当作“冷得像寒蝉”，属望文生义。"},{"t":"choice","q":"他的学问____，已得师门真传，非一般浅尝者可比。","a":"登堂入室","d":["开门见山","走马观花","浅尝辄止"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"登堂入室：登上厅堂、进入内室，比喻学问或技艺由浅入深、循序渐进，达到很高水平。句中“已得师门真传”正合此义。易错点：最易被望文生义成“走进房间”，从而误选“开门见山”（说话写文章一开头就进入正题）；“走马观花”指粗略观察，“浅尝辄止”指略微尝试就停止，二者都与“学问精进”相反。"},{"t":"choice","q":"他贪污受贿，群众对他____，敢怒而不敢言。","a":"侧目而视","d":["刮目相看","另眼相看","肃然起敬"],"dt":["望文生义","望文生义","褒贬误用"],"idi":"","m":"望文生义","n":"侧目而视：斜着眼睛看，不敢正视，形容又怕又恨的神情。句中“敢怒而不敢言”正合此义。易错点：最易被望文生义成“斜眼看、轻视”，且易与“刮目相看”（用新眼光看待别人的进步）、“另眼相看”（特别看重）相混；“肃然起敬”指产生敬佩，是褒义，与“敢怒不敢言”的憎惧之情正好相反。"},{"t":"judge","q":"他声名狼藉，走到哪里都不受待见。","a":"√","d":[],"dt":[],"idi":"声名狼藉","m":"褒贬误用","n":"✓ 用法正确。“声名狼藉”形容名声极坏，是贬义词。句中“不受待见”正合此义。"},{"t":"choice","q":"这件玉雕构思精巧、刀法细腻，堪称____。","a":"巧夺天工","d":["栩栩如生","美轮美奂","妙手回春"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"巧夺天工：人工的精巧胜过天然，形容技艺极其高超。句中写玉雕的精湛技艺，正合此义。易错点：该成语形容的是“技艺”，而非事物本身——“栩栩如生”形容艺术形象逼真，“美轮美奂”只用于房屋建筑，“妙手回春”只用于称赞医生的医术，三者用于“玉雕技艺”均属对象错位。"},{"t":"choice","q":"这家饭馆经营不善，如今____，与当年的红火判若天渊。","a":"门可罗雀","d":["门庭若市","车水马龙","熙熙攘攘"],"dt":["对象误用","对象误用","对象误用"],"idi":"","m":"对象误用","n":"门可罗雀：罗，张网捕捉；门前可以张网捕雀，形容门前冷落、宾客稀少。句中“经营不善”“与当年的红火判若天渊”正合此义。易错点：该成语形容门前冷落——“门庭若市”形容门前热闹，“车水马龙”形容车马往来繁华，“熙熙攘攘”形容人来人往热闹，三者都与“冷清”相反。"},{"t":"choice","q":"农历七月，____，暑气渐消，天气转凉。","a":"七月流火","d":["烈日炎炎","骄阳似火","酷暑难当"],"dt":["望文生义","望文生义","望文生义"],"idi":"","m":"望文生义","n":"七月流火：语出《诗经·豳风·七月》，“火”指大火星（心宿），“流”指偏西下行；指农历七月大火星西移，天气逐渐转凉。句中“暑气渐消、天气转凉”正合本义。易错点：这是望文生义的头号典型——“火”被误作“炎热”，于是“烈日炎炎”“骄阳似火”“酷暑难当”三个表“炎热”的成语看似贴切，实则与本义“转凉”正好相反。"},{"t":"judge","q":"想起那次惊险的事故，他至今仍心有余悸。","a":"√","d":[],"dt":[],"idi":"心有余悸","m":"望文生义","n":"✓ 用法正确。“心有余悸”指危险的事情虽然过去，回想起来心里还害怕。句中“至今仍心有余悸”正合此义。"},{"t":"judge","q":"舞台上的演员表演得栩栩如生。","a":"×","d":[],"dt":[],"idi":"栩栩如生","m":"对象误用","n":"✗ 用法有误。“栩栩如生”形容艺术形象（画中、塑像等）生动逼真、像活的一样，只用于没有生命的艺术形象，不能形容演员本人的表演。句中用它形容演员，属对象误用。"},{"t":"judge","q":"这一点绵薄之力，不成敬意。","a":"√","d":[],"dt":[],"idi":"绵薄之力","m":"谦敬错位","n":"✓ 用法正确。“绵薄之力”指自己微薄的力量，是谦辞。句中“不成敬意”正合自谦之意。"},{"t":"judge","q":"我们要变本加厉，把工作做得更好。","a":"×","d":[],"dt":[],"idi":"变本加厉","m":"褒贬误用","n":"✗ 用法有误。“变本加厉”指情况变得比原来更加严重，是贬义词，不能用于“把工作做得更好”的褒义语境。句中误把它当作“再接再厉”，属褒贬误用。"},{"t":"judge","q":"他把各科知识融会贯通。","a":"√","d":[],"dt":[],"idi":"融会贯通","m":"望文生义","n":"✓ 用法正确。“融会贯通”指把各方面知识道理融合贯穿、全面透彻地理解。句中“各科知识”正合此义。"},{"t":"judge","q":"他跑得汗流浃背。","a":"√","d":[],"dt":[],"idi":"汗流浃背","m":"望文生义","n":"✓ 用法正确。“汗流浃背”形容满身大汗。句中“跑得”正合此义。"},{"t":"judge","q":"他几十年造福乡里，功绩罄竹难书。","a":"×","d":[],"dt":[],"idi":"罄竹难书","m":"对象误用","n":"✗ 用法有误。“罄竹难书”形容罪行多得写不完，只能用于罪恶，不能用于功绩。句中用它形容“功绩”，属对象误用。"},{"t":"judge","q":"我虚怀若谷，广纳各方意见。","a":"×","d":[],"dt":[],"idi":"虚怀若谷","m":"谦敬错位","n":"✗ 用法有误。“虚怀若谷”形容十分谦虚、胸怀宽广，是带敬辞色彩的褒义成语，只能用于称颂他人，不能用于自己。句中用于自己，属谦敬错位。"},{"t":"judge","q":"这样的机会绝无仅有，一定要把握住。","a":"√","d":[],"dt":[],"idi":"绝无仅有","m":"望文生义","n":"✓ 用法正确。“绝无仅有”指极其少有。句中“一定要把握住”正合此义。"},{"t":"judge","q":"他的书法独树一帜，自成一家。","a":"√","d":[],"dt":[],"idi":"独树一帜","m":"望文生义","n":"✓ 用法正确。“独树一帜”比喻创造出独特风格、自成一家。句中“自成一家”正合此义。"},{"t":"choice","q":"他放在抽屉里的钱包____，翻遍了房间也没找到。","a":"不翼而飞","d":["不胫而走","无影无踪","销声匿迹"],"dt":["近义辨析","近义辨析","近义辨析"],"idi":"","m":"近义辨析","n":"不翼而飞：没有翅膀却飞走了，比喻东西突然丢失。句中“钱包……没找到”正合此义。易错点：与“不胫而走”是经典辨析对，区别在于“不翼而飞”说东西丢失，“不胫而走”说消息传播；“无影无踪”指完全消失、找不到踪迹，多用于人或事物隐没；“销声匿迹”指不再公开露面，二者都不专指失物。"}]</script>
