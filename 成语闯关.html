var KEY = 'chengyu_game_v2';
var TYPES = ['望文生义','对象误用','褒贬误用','近义辨析','近义误用','谦敬错位'];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));
var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function blank(s){return esc(s).replace(/____/g,'<em>________</em>')}
function hiIdiom(s,idi){return esc(s).replace(idi,'<em>'+idi+'</em>')}

function newState(seed){
  var st={seed:seed||(Date.now()%1e9),level:0,scores:{},wrong:{},done:false,
          stats:{total:0,correct:0}};
  TYPES.forEach(function(t){st.stats[t]={T:0,C:0}});
  return st;
}
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S = load() || newState();
TYPES.forEach(function(t){if(!S.stats[t])S.stats[t]={T:0,C:0}});
var levelsCache=null, curQ=null, curSel=null, drill=null;

function buildLevels(){
  if(levelsCache) return levelsCache;
  var r = mulberry32(S.seed>>>0);
  var all = BANK.map(function(o,i){return {i:i,o:o}});
  all = shuffle(all, r);
  var lv=[];
  for(var i=0;i<NLV;i++){
    var qs = all.slice(i*PER, i*PER+PER);
    var pos=[]; for(var k=0;k<qs.length;k++) pos.push((k+i)%4);
    pos = shuffle(pos, r);
    qs.forEach(function(q,k){ if(q.o.t==='choice') q.ci=pos[k]; });
    lv.push(qs);
  }
  levelsCache=lv; return lv;
}
function go(id){['home','level','result','report','wrong','drill'].forEach(function(x){
  document.getElementById('s-'+x).classList.add('hide')});
  document.getElementById('s-'+id).classList.remove('hide');
  window.scrollTo(0,0);
}
function mkChoiceOpts(o,ci,r){
  var pairs = o.d.map(function(x,i){return [x, o.dt[i]]});
  pairs = shuffle(pairs, r);
  var opts=[], dts=[];
  pairs.forEach(function(p){opts.push(p[0]); dts.push(p[1])});
  return {opts: opts.slice(0,ci).concat([o.a], opts.slice(ci)),
          dts: dts.slice(0,ci).concat(['正确释义'], dts.slice(ci))};
}

function renderHome(){
  var done=0; for(var k in S.scores) done++;
  var pct=S.stats.total?Math.round(S.stats.correct/S.stats.total*100):0;
  var h='<div class="card"><h1>成语闯关</h1>'
   +'<div class="sub">高考成语语义 '+BANK.length+' 题　共 '+NLV+' 关，每关 '+PER+' 题</div>'
   +'<div class="sub" style="margin-top:2px">选词填空 + 用法判断 · 望文生义/对象/褒贬/近义/谦敬</div>'
   +'<div class="bar"><i style="width:'+Math.round(done/NLV*100)+'%"></i></div>'
   +'<div class="stat" style="margin-top:10px">'
   +'<div><b>'+done+'</b><span>已通关</span></div>'
   +'<div><b>'+pct+'%</b><span>总正确率</span></div>'
   +'<div><b>'+Object.keys(S.wrong).length+'</b><span>错题数</span></div></div></div>'
   +'<div class="row"><button class="btn pri" onclick="startLevel('+S.level+')">'
   +(done?('继续第 '+(S.level+1)+' 关'):'开始闯关')+'</button></div>'
   +'<div class="row" style="margin-top:10px">'
   +'<button class="btn" onclick="openMap()">关卡地图</button>'
   +'<button class="btn" onclick="openWrong()">错题本</button></div>'
   +'<div class="row" style="margin-top:10px">'
   +'<button class="btn gh" onclick="if(confirm(\'重新打乱题目顺序？题库不变，进度会重置。\'))reseed()">随机一下</button>'
   +'<button class="btn gh" onclick="resetAll()">清空进度</button></div>';
  if(done>=NLV) h+='<div class="row" style="margin-top:10px">'
   +'<button class="btn ok" onclick="renderReport()">查看总报告</button></div>';
  document.getElementById('s-home').innerHTML=h;
  go('home');
}
function openMap(){
  var h='<div class="card"><h2>关卡地图</h2><div class="sub">已通关 '
   +Object.keys(S.scores).length+' / '+NLV+'</div><div class="grid" style="margin-top:12px">';
  for(var i=0;i<NLV;i++){
    var cls='lv', sc=S.scores[i];
    if(sc!==undefined) cls+=' done';
    else if(i>S.level) cls+=' lock';
    if(i===S.level) cls+=' cur';
    h+='<div class="'+cls+'" onclick="'+(i<=S.level?('startLevel('+i+')'):'')+'">'
     +(i+1)+(sc!==undefined?('<small>'+sc+'</small>'):'<small>&nbsp;</small>')+'</div>';
  }
  h+='</div></div><div class="row"><button class="btn" onclick="renderHome()">返回</button></div>';
  document.getElementById('s-home').innerHTML=h; go('home');
}
function startLevel(i){
  if(i>NLV-1){renderReport();return}
  curQ=buildLevels()[i]; curSel=new Array(curQ.length).fill(-1);
  document.getElementById('lvTag').textContent='第 '+(i+1)+' 关　'+Math.round(i/NLV*100)+'%';
  renderLevel(i); go('level');
}
function renderLevel(i){
  var h='<div class="card">';
  curQ.forEach(function(q,k){
    var o=q.o, r=mulberry32((S.seed+i*37+k)>>>0);
    if(o.t==='choice'){
      var mk=mkChoiceOpts(o, q.ci, r);
      q.opts=mk.opts; q.dts=mk.dts; q.ans=o.a;
      h+='<div class="qb"><div class="qh"><span class="sub">第 '+(k+1)+' 题</span>'
       +'<span class="tag">'+esc(o.m)+'</span><span class="tag g">选词填空</span></div>'
       +'<div class="q">在下列句子的空格处填入成语，最恰当的一项是（　　）<br>'+blank(o.q)+'</div>'
       +'<div class="opts" id="o'+k+'">';
      q.opts.forEach(function(op,j){
        h+='<div class="opt" id="q'+k+'p'+j+'" onclick="pick('+k+','+j+')">'
         +'<span class="k">'+'ABCD'[j]+'</span><span>'+op+'</span></div>';
      });
      h+='</div><div id="t'+k+'"></div></div>';
    } else {
      q.opts=['√','×']; q.ans=o.a;
      h+='<div class="qb"><div class="qh"><span class="sub">第 '+(k+1)+' 题</span>'
       +'<span class="tag j">'+esc(o.m)+'</span><span class="tag g">用法判断</span></div>'
       +'<div class="q">判断句中成语（带下划线）的使用是否正确：<br>'+hiIdiom(o.q,o.idi)+'</div>'
       +'<div class="jopts" id="o'+k+'">'
       +'<div class="jopt" id="q'+k+'p0" onclick="pick('+k+',0)">√<small>用法正确</small></div>'
       +'<div class="jopt" id="q'+k+'p1" onclick="pick('+k+',1)">×<small>用法错误</small></div>'
       +'</div><div id="t'+k+'"></div></div>';
    }
  });
  h+='<div class="row" style="margin-top:6px">'
   +'<button class="btn pri" onclick="submit('+i+')">提交本关</button>'
   +'<button class="btn gh" onclick="renderHome()">退出</button></div></div>';
  document.getElementById('lvBody').innerHTML=h;
}
function pick(k,j){
  if(curSel[k]!==-1) return;
  curSel[k]=j;
  var q=curQ[k], right=(q.opts[j]===q.ans);
  if(q.o.t==='choice'){
    for(var x=0;x<q.opts.length;x++){
      var el=document.getElementById('q'+k+'p'+x), cls='opt';
      if(q.opts[x]===q.ans) cls+=' right';
      else if(x===j) cls+=' wrong';
      el.className=cls;
      var lab = q.opts[x]===q.ans ? '正确释义见下方' : (esc(q.dts[x])+'（干扰）');
      el.getElementsByTagName('span')[1].innerHTML = q.opts[x]+'<small>'+lab+'</small>';
    }
  } else {
    for(var x=0;x<2;x++){
      var el=document.getElementById('q'+k+'p'+x), cls='jopt';
      if(q.opts[x]===q.ans) cls+=' right';
      else if(x===j) cls+=' wrong';
      el.className=cls;
    }
  }
  document.getElementById('t'+k).innerHTML=
    '<div class="tip '+(right?'ok':'bad')+'"><b>'+(right?'✓ 正确　':'✗ 正确答案：'+q.ans+'　')
    +'</b>'+esc(q.o.n)+'</div>';
}
function submit(i){
  var score=0;
  curQ.forEach(function(q,k){
    var u=curSel[k], right=(u>=0 && q.opts[u]===q.ans);
    if(right) score++;
    var t=q.o.m;
    if(!S.stats[t]) S.stats[t]={T:0,C:0};
    S.stats[t].T++; if(right) S.stats[t].C++;
    S.stats.total++; if(right) S.stats.correct++;
    if(!right){
      var key=q.o.t+'|'+q.o.q+'|'+q.ans;
      if(!S.wrong[key]) S.wrong[key]={t:q.o.t,q:q.o.q,a:q.ans,d:q.o.d,dt:q.o.dt,
        idi:q.o.idi,m:t,n:q.o.n,c:0};
      S.wrong[key].c++;
    }
  });
  S.scores[i]=Math.max(S.scores[i]||0,score);
  if(i===S.level && S.level<NLV-1) S.level++;
  else if(i===S.level) S.done=true;
  save(); renderResult(i,score);
}
function renderResult(i,score){
  var r=Math.round(score/curQ.length*100);
  var msg=r>=90?'优秀！':r>=75?'不错':r>=60?'及格':'还需加油';
  var h='<div class="card" style="text-align:center"><h2>第 '+(i+1)+' 关完成</h2>'
   +'<div style="font-size:38px;font-weight:600;color:'+(r>=60?'var(--ok)':'var(--bad)')+'">'
   +score+' / '+curQ.length+'</div>'
   +'<div class="sub">'+msg+'　正确率 '+r+'%</div>'
   +'<div class="row" style="margin-top:14px">';
  if(i+1<NLV) h+='<button class="btn pri" onclick="startLevel('+(i+1)+')">下一关</button>';
  else h+='<button class="btn ok" onclick="renderReport()">查看总报告</button>';
  h+='<button class="btn" onclick="startLevel('+i+')">重做本关</button>'
   +'</div><div class="row"><button class="btn gh" onclick="renderHome()">返回首页</button></div></div>';
  document.getElementById('s-result').innerHTML=h; go('result');
}
function renderReport(){
  var st=S.stats, tot=st.total||1;
  var rows='', weak='望文生义', wr=101;
  TYPES.forEach(function(t){
    var o=st[t]||{T:0,C:0}, p=o.T?Math.round(o.C/o.T*100):0;
    if(o.T && p<wr){wr=p;weak=t}
    rows+='<tr><td>'+t+'</td><td>'+o.T+'</td><td>'+o.C+'</td><td>'+p+'%</td></tr>';
  });
  var wl=Object.keys(S.wrong).map(function(k){return S.wrong[k]}).sort(function(a,b){return b.c-a.c});
  var h='<div class="card"><h2>闯关总报告</h2>'
   +'<div class="stat"><div><b>'+Math.round(st.correct/tot*100)+'%</b><span>总正确率</span></div>'
   +'<div><b>'+st.correct+'</b><span>答对</span></div>'
   +'<div><b>'+st.total+'</b><span>已答</span></div></div>'
   +'<table style="margin-top:12px"><tr><th>考点</th><th>题数</th><th>正确</th><th>正确率</th></tr>'
   +rows+'<tr><td><b>合计</b></td><td><b>'+st.total+'</b></td><td><b>'+st.correct+'</b></td><td><b>'
   +Math.round(st.correct/tot*100)+'%</b></td></tr></table>'
   +'<div class="sub" style="margin-top:10px">薄弱考点：'+weak+'（正确率 '+wr+'%）</div></div>';
  if(wl.length){
    h+='<div class="card"><h2>高频错题 Top 20</h2>';
    wl.slice(0,20).forEach(function(x){
      var qs = x.t==='choice' ? blank(x.q) : hiIdiom(x.q, x.idi);
      h+='<div class="wl">'+qs+'　→ '+x.a
       +'<span class="mini" style="margin-left:6px">'+esc(x.m)+'</span>'
       +'<em>错 '+x.c+' 次　'+esc(x.n)+'</em></div>';
    });
    h+='</div>';
  }
  h+='<div class="row"><button class="btn pri" onclick="openWrong()">进入错题本</button>'
   +'<button class="btn" onclick="renderHome()">返回首页</button></div>';
  document.getElementById('s-report').innerHTML=h; go('report');
}
function wrongList(){
  return Object.keys(S.wrong).map(function(k){return S.wrong[k]}).sort(function(a,b){return b.c-a.c});
}
function dropWrong(x){
  var ks=Object.keys(S.wrong).filter(function(k){return S.wrong[k].q===x.q && S.wrong[k].a===x.a});
  if(ks.length) delete S.wrong[ks[0]];
  save();
}
function openWrong(){
  var wl=wrongList();
  var h='<div class="card"><h2>错题本（'+wl.length+'）</h2>';
  if(!wl.length) h+='<div class="sub">还没有错题，继续保持！</div>';
  else{
    h+='<div class="row" style="margin-bottom:10px">'
     +'<button class="btn pri" onclick="startDrill()">专项重练（'+wl.length+' 题）</button></div>';
    wl.forEach(function(x,idx){
      var qs = x.t==='choice' ? blank(x.q) : hiIdiom(x.q, x.idi);
      h+='<div class="wl" id="wq'+idx+'"><div>'+qs
       +'<span class="mini" style="margin-left:6px">'+esc(x.m)+'</span></div>'
       +'<div class="row" style="margin-top:6px">';
      if(x.t==='choice'){
        var r=mulberry32(idx+7); var opts=shuffle([x.a].concat(x.d), r);
        opts.forEach(function(op){
          h+='<button class="btn" style="flex:0 0 auto;min-width:64px;padding:7px 10px" '
           +'onclick="wans('+idx+',\''+op+'\')">'+op+'</button>';
        });
      } else {
        h+='<button class="btn" style="flex:0 0 auto;min-width:64px;padding:7px 10px" onclick="wans('+idx+',\'√\')">√</button>'
         +'<button class="btn" style="flex:0 0 auto;min-width:64px;padding:7px 10px" onclick="wans('+idx+',\'×\')">×</button>';
      }
      h+='</div><em>答案：'+x.a+'　'+esc(x.n)+'</em></div>';
    });
  }
  h+='</div><div class="row"><button class="btn" onclick="renderHome()">返回首页</button>'
   +(wl.length?'<button class="btn gh" onclick="clearWrong()">清空错题本</button>':'')+'</div>';
  document.getElementById('s-wrong').innerHTML=h; go('wrong');
}
function wans(i,sel){
  var el=document.getElementById('wq'+i);
  if(!el) return;
  var x=wrongList()[i];
  if(!x) return;
  el.style.background=(sel===x.a)?'#e8f5ee':'#fdecec';
  if(sel===x.a) dropWrong(x);
}
function clearWrong(){if(confirm('清空错题本？')){S.wrong={};save();openWrong()}}

function startDrill(){
  var wl=wrongList();
  if(!wl.length){openWrong();return}
  drill={list:wl, idx:0, right:0};
  renderDrill(); go('drill');
}
function renderDrill(){
  var x=drill.list[drill.idx];
  var h='<div class="card"><div class="qh"><span class="sub">专项重练 '
   +(drill.idx+1)+' / '+drill.list.length+'</span><span class="tag j">'+esc(x.m)+'</span>'
   +'<span class="tag g">已答对 '+drill.right+'</span></div>';
  if(x.t==='choice'){
    var r=mulberry32(drill.idx*13+5);
    var opts=shuffle([x.a].concat(x.d), r);
    h+='<div class="q">在下列句子的空格处填入成语，最恰当的一项是（　　）<br>'+blank(x.q)+'</div>'
     +'<div class="opts" id="dopt">';
    opts.forEach(function(op,j){
      h+='<div class="opt" id="dp'+j+'" onclick="dpick('+j+')">'
       +'<span class="k">'+'ABCD'[j]+'</span><span>'+op+'</span></div>';
    });
    h+='</div>';
    drill.opts=opts;
  } else {
    h+='<div class="q">判断句中成语（带下划线）的使用是否正确：<br>'+hiIdiom(x.q,x.idi)+'</div>'
     +'<div class="jopts" id="dopt">'
     +'<div class="jopt" id="dp0" onclick="dpick(0)">√<small>用法正确</small></div>'
     +'<div class="jopt" id="dp1" onclick="dpick(1)">×<small>用法错误</small></div>'
     +'</div>';
    drill.opts=['√','×'];
  }
  h+='<div id="dtip"></div>'
   +'<div class="row" style="margin-top:10px"><button class="btn pri" onclick="dnext()">'
   +(drill.idx===drill.list.length-1?'完成重练':'下一题')+'</button>'
   +'<button class="btn gh" onclick="openWrong()">结束</button></div></div>';
  document.getElementById('s-drill').innerHTML=h;
  drill.ans=x.a; drill.picked=-1; drill.cur=x;
}
function dpick(j){
  if(drill.picked!==-1) return;
  drill.picked=j;
  var right=(drill.opts[j]===drill.ans);
  var x=drill.cur;
  if(x.t==='choice'){
    for(var i=0;i<drill.opts.length;i++){
      var el=document.getElementById('dp'+i), cls='opt';
      if(drill.opts[i]===drill.ans) cls+=' right'; else if(i===j) cls+=' wrong';
      el.className=cls;
    }
  } else {
    for(var i=0;i<2;i++){
      var el=document.getElementById('dp'+i), cls='jopt';
      if(drill.opts[i]===drill.ans) cls+=' right'; else if(i===j) cls+=' wrong';
      el.className=cls;
    }
  }
  if(right){ drill.right++; dropWrong(x); } else { x.c++; save(); }
  document.getElementById('dtip').innerHTML='<div class="tip '+(right?'ok':'bad')+'"><b>'
   +(right?'✓ 正确　':'✗ 正确答案：'+drill.ans+'　')+'</b>'+esc(x.n)+'</div>';
}
function dnext(){
  if(drill.idx>=drill.list.length-1){
    var n=drill.list.length, rt=drill.right;
    document.getElementById('s-drill').innerHTML='<div class="card" style="text-align:center">'
     +'<h2>重练完成</h2><div style="font-size:34px;font-weight:600;color:var(--ok)">'+rt+' / '+n+'</div>'
     +'<div class="sub">正确率 '+Math.round(rt/n*100)+'%</div>'
     +'<div class="row" style="margin-top:14px">'
     +'<button class="btn pri" onclick="startDrill()">再练一轮</button>'
     +'<button class="btn" onclick="openWrong()">回到错题本</button></div>'
     +'<div class="row"><button class="btn gh" onclick="renderHome()">返回首页</button></div></div>';
    return;
  }
  drill.idx++; renderDrill();
}
function reseed(){S=newState();levelsCache=null;save();renderHome()}
function resetAll(){if(confirm('清空全部进度？')){S=newState(S.seed);levelsCache=null;save();renderHome()}}

document.addEventListener('DOMContentLoaded', renderHome);
</script>
</body>
</html>
