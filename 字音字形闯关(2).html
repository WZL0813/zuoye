<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>字音字形闯关 · 中职易错字特训</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f6f8;--card:#fff;--line:#e3e6ea;--txt:#1f2328;--sub:#6b7280;
--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--r:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--txt);line-height:1.6;font-size:16px;
padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;font-weight:600}
h2{font-size:17px;font-weight:600;margin-bottom:10px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);
border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;flex:1;
min-width:120px;text-align:center;transition:.12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.gh{background:transparent}
.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px}
.lv{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--card);
display:flex;flex-direction:column;align-items:center;justify-content:center;
font-size:14px;cursor:pointer}
.lv.done{background:#e8f5ee;border-color:#b7e2c8;color:var(--ok)}
.lv.cur{border-color:var(--pri);border-width:2px;color:var(--pri)}
.lv.lock{opacity:.4;cursor:not-allowed}
.lv small{font-size:10px;color:var(--sub)}
.lv.done small{color:var(--ok)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px;transition:.3s}
.q{font-size:19px;margin:6px 0 14px;letter-spacing:1px}
.q b{color:var(--pri)}
.opt{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;
background:var(--card);cursor:pointer;font-size:17px;display:flex;gap:11px;
align-items:flex-start;transition:.12s}
.opt .k{font-weight:600;color:var(--sub);min-width:20px}
.opt.sel{border-color:var(--pri);background:#eff6ff}
.opt.right{border-color:var(--ok);background:#e8f5ee}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.opt.wrong .k{color:var(--bad)}
.tip{border-radius:11px;padding:11px 13px;font-size:14px;margin-top:10px}
.tip.ok{background:#e8f5ee;color:#14663a}
.tip.bad{background:#fdecec;color:#9b1c1c}
.stat{display:flex;gap:10px;text-align:center}
.stat div{flex:1;background:var(--bg);border-radius:10px;padding:9px}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--sub)}
.wl{border-bottom:1px solid var(--line);padding:9px 0;font-size:15px}
.wl:last-child{border:0}
.wl em{font-style:normal;color:var(--sub);font-size:12px;display:block}
.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div id="s-home"></div>
  <div id="s-level"><div class="sub" id="lvTag" style="margin-bottom:8px"></div><div id="lvBody"></div></div>
  <div id="s-result" class="hide"></div>
  <div id="s-report" class="hide"></div>
  <div id="s-wrong" class="hide"></div>
</div>

}
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S = load() || newState();
var levelsCache = null, curQ = null, curSel = null;

function buildLevels(){
  if(levelsCache) return levelsCache;
  var r = mulberry32(S.seed>>>0);
  // 全部题库洗牌后顺序切分 —— 每一题恰好出现一次，零重复、全覆盖
  var all = BANK.p.map(function(o){return {type:'p',o:o}}).concat(
            BANK.h.map(function(o){return {type:'h',o:o}}));
  all = shuffle(all, r);
  var lv = [];
  for(var i=0;i<NLV;i++){
    var qs = all.slice(i*PER, i*PER+PER);
    // 正确答案位置均匀铺开（A/B/C/D 各占约 1/4）
    var pos = [];
    for(var k2=0;k2<qs.length;k2++) pos.push((k2 + i) % 4);
    pos = shuffle(pos, r);
    qs.forEach(function(q,k3){q.ci = pos[k3]});
    lv.push(qs);
  }
  levelsCache = lv;
  return lv;
}

function go(id){['home','level','result','report','wrong'].forEach(function(x){
  document.getElementById('s-'+x).classList.add('hide')});
  document.getElementById('s-'+id).classList.remove('hide');
  window.scrollTo(0,0);
}

function renderHome(){
  var lv = buildLevels(), done = 0, tot = 0;
  for(var k in S.scores){done++;tot+=S.scores[k]}
  var pct = S.stats.total? Math.round(S.stats.correct/S.stats.total*100):0;
  var html = '<div class="card"><h1>字音字形闯关</h1>'
    + '<div class="sub">题库 '+BANK.p.length+' 字音 · '+BANK.h.length
    + ' 字形　共 '+NLV+' 关，每关 '+PER+' 题</div>'
    + '<div class="bar"><i style="width:'+done+'%"></i></div>'
    + '<div class="stat" style="margin-top:10px">'
    + '<div><b>'+done+'</b><span>已通关</span></div>'
    + '<div><b>'+pct+'%</b><span>总正确率</span></div>'
    + '<div><b>'+Object.keys(S.wrong).length+'</b><span>错题数</span></div>'
    + '</div></div>'
    + '<div class="row"><button class="btn pri" onclick="startLevel('+S.level+')">'
    + (done? '继续第 '+(S.level+1)+' 关':'开始闯关')+'</button></div>'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="btn" onclick="openMap()">关卡地图</button>'
    + '<button class="btn" onclick="openWrong()">错题本</button></div>'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="btn gh" onclick="if(confirm('+"'重新打乱题目顺序？题库不变，进度会重置。'"+'))reseed()">随机一下</button>'
    + '<button class="btn gh" onclick="resetAll()">清空进度</button></div>';
  if(done>=NLV) html += '<div class="row" style="margin-top:10px">'
    + '<button class="btn ok" onclick="renderReport()">查看总报告</button></div>';
  document.getElementById('s-home').innerHTML = html;
  go('home');
}

function openMap(){
  done = Object.keys(S.scores).length;
  var h = '<div class="card"><h2>关卡地图</h2><div class="sub">已通关 '+
    Object.keys(S.scores).length+' / '+NLV+'</div><div class="grid" style="margin-top:12px">';
  for(var i=0;i<NLV;i++){
    var cls='lv', sc=S.scores[i];
    if(sc!==undefined){cls+=' done'}
    else if(i>S.level){cls+=' lock'}
    if(i===S.level) cls+=' cur';
    h+='<div class="'+cls+'" onclick="'+(i<=S.level?'startLevel('+i+')':'')+'">'
      +(i+1)+(sc!==undefined?'<small>'+sc+'</small>':'<small>&nbsp;</small>')+'</div>';
  }
  h+='</div></div><div class="row"><button class="btn" onclick="renderHome()">返回</button></div>';
  document.getElementById('s-home').innerHTML = h;
  go('home');
}

function startLevel(i){
  if(i>NLV-1){renderReport();return}
  curQ = buildLevels()[i]; curSel = new Array(curQ.length).fill(-1);
  document.getElementById('lvTag').textContent = '第 '+(i+1)+' 关　'+
    Math.round((i)/NLV*100)+'%';
  renderLevel(i);
  go('level');
}

function renderLevel(i){
  var h = '<div class="card">';
  curQ.forEach(function(q,k){
    var o=q.o, ans, opts;
    if(q.type==='p'){
      var w=o.w, ti=w.indexOf(o.t);
      ans=o.a; opts=shuffle([ans].concat(o.d), mulberry32((S.seed+i*31+k)>>>0));
      h+='<div style="margin-bottom:18px"><div class="sub">字音 · 第 '+(k+1)+' 题</div>'
        +'<div class="q">'+w.slice(0,ti)+'<b>'+o.t+'</b>'+w.slice(ti+1)
        +'（　　）</div><div id="o'+k+'">';
      opts.forEach(function(op,j){
        h+='<div class="opt" id="q'+k+'p'+j+'" onclick="pick('+k+','+j+')">'
          +'<span class="k">'+'ABCD'[j]+'</span><span>'+op+'</span></div>';
      });
      h+='</div><div id="t'+k+'"></div></div>';
    } else {
      ans=o.a; opts=shuffle([ans].concat(o.d), mulberry32((S.seed+i*37+k)>>>0));
      h+='<div style="margin-bottom:18px"><div class="sub">字形 · 第 '+(k+1)+' 题</div>'
        +'<div class="q">'+o.s+'</div><div id="o'+k+'">';
      opts.forEach(function(op,j){
        h+='<div class="opt" id="q'+k+'p'+j+'" onclick="pick('+k+','+j+')">'
          +'<span class="k">'+'ABCD'[j]+'</span><span>'+op+'</span></div>';
      });
      h+='</div><div id="t'+k+'"></div></div>';
    }
    q.opts = opts; q.ans = ans;
  });
  h += '<div class="row"><button class="btn pri" onclick="submit('+i+')">提交本关</button>'
     + '<button class="btn gh" onclick="renderHome()">退出</button></div></div>';
  document.getElementById('lvBody').innerHTML = h;
}

function pick(k,j){
  if(curSel[k]!==-1) return;
  curSel[k]=j;
  var q=curQ[k], right = (q.opts[j]===q.ans);
  for(var x=0;x<q.opts.length;x++){
    var el=document.getElementById('q'+k+'p'+x);
    el.className='opt'+(q.opts[x]===q.ans?' right':(x===j?' wrong':''));
  }
  var w = q.type==='p'? q.o.w : q.o.w;
  document.getElementById('t'+k).innerHTML =
    '<div class="tip '+(right?'ok':'bad')+'">'+(right?'✓ 正确':'✗ 正确答案：'+q.ans)
    +'<br>'+esc(q.o.n)+'</div>';
}

function submit(i){
  var score=0;
  curQ.forEach(function(q,k){
    var u=curSel[k], right=(u>=0 && q.opts[u]===q.ans);
    if(right) score++;
    if(q.type==='p'){S.stats.pT++; if(right)S.stats.pC++}
    else {S.stats.hT++; if(right)S.stats.hC++}
    S.stats.total++; if(right)S.stats.correct++;
    if(!right){
      var key = q.type+':'+(q.type==='p'? q.o.w+q.o.t : q.o.w+q.o.a);
      if(!S.wrong[key]) S.wrong[key]={type:q.type,w:q.o.w,
        t:q.type==='p'?q.o.t:'', a:q.o.a, s:q.o.s||'', n:q.o.n, c:0};
      S.wrong[key].c++;
    }
  });
  var prev=S.scores[i];
  S.scores[i]=Math.max(prev||0, score);
  if(i===S.level && S.level<NLV-1) S.level++;
  else if(i===S.level && S.level===NLV-1) S.level=NLV-1, S.done=true;
  save();
  renderResult(i,score);
}

function renderResult(i,score){
  var r=Math.round(score/curQ.length*100);
  var msg = r>=90?'优秀！':r>=75?'不错':r>=60?'及格':'还需加油';
  var h='<div class="card" style="text-align:center"><h2>第 '+(i+1)+' 关完成</h2>'
   +'<div style="font-size:38px;font-weight:600;color:'+(r>=60?'var(--ok)':'var(--bad)')+'">'
   +score+' / '+curQ.length+'</div>'
   +'<div class="sub">'+msg+'　正确率 '+r+'%</div>'
   +'<div class="row" style="margin-top:14px">';
  if(i+1<NLV) h+='<button class="btn pri" onclick="startLevel('+(i+1)+')">下一关</button>';
  else h+='<button class="btn ok" onclick="renderReport()">查看总报告</button>';
  h+='<button class="btn" onclick="startLevel('+i+')">重做本关</button>'
   +'</div><div class="row"><button class="btn gh" onclick="renderHome()">返回首页</button></div>'
   +'</div>';
  document.getElementById('s-result').innerHTML=h;
  go('result');
}

function renderReport(){
  var st=S.stats, tot=st.total||1;
  var pr = st.pT? Math.round(st.pC/st.pT*100):0;
  var hr = st.hT? Math.round(st.hC/st.hT*100):0;
  var wr = Object.keys(S.wrong).map(function(k){return S.wrong[k]})
    .sort(function(a,b){return b.c-a.c});
  var h='<div class="card"><h2>闯关总报告</h2>'
   +'<div class="stat"><div><b>'+Math.round(st.correct/tot*100)+'%</b><span>总正确率</span></div>'
   +'<div><b>'+pr+'%</b><span>字音</span></div>'
   +'<div><b>'+hr+'%</b><span>字形</span></div></div>'
   +'<table style="margin-top:12px"><tr><th>项目</th><th>题数</th><th>正确</th><th>正确率</th></tr>'
   +'<tr><td>字音</td><td>'+st.pT+'</td><td>'+st.pC+'</td><td>'+pr+'%</td></tr>'
   +'<tr><td>字形</td><td>'+st.hT+'</td><td>'+st.hC+'</td><td>'+hr+'%</td></tr>'
   +'<tr><td>合计</td><td>'+st.total+'</td><td>'+st.correct+'</td><td>'
   +Math.round(st.correct/tot*100)+'%</td></tr></table></div>';
  if(wr.length){
    h+='<div class="card"><h2>高频错题 Top 20</h2>';
    wr.slice(0,20).forEach(function(x){
      h+='<div class="wl">'+(x.type==='p'? ('【字音】'+x.w+'　'+x.t+'（　）　读 '+x.a)
        : ('【字形】'+x.s+'　→ '+x.a))
       +'<em>错 '+x.c+' 次　'+esc(x.n)+'</em></div>';
    });
    h+='</div>';
  }
  h+='<div class="row"><button class="btn pri" onclick="openWrong()">进入错题本</button>'
   +'<button class="btn" onclick="renderHome()">返回首页</button></div>';
  document.getElementById('s-report').innerHTML=h;
  go('report');
}

function openWrong(){
  var wr=Object.keys(S.wrong).map(function(k){return S.wrong[k]})
    .sort(function(a,b){return b.c-a.c});
  var h='<div class="card"><h2>错题本（'+wr.length+'）</h2>';
  if(!wr.length) h+='<div class="sub">还没有错题，继续保持！</div>';
  else wr.forEach(function(x,idx){
    var opts = shuffle([x.a].concat(
      (x.type==='p'? (BANK.p.filter(function(o){return o.w===x.w})[0]||{d:[]}).d
                   : (BANK.h.filter(function(o){return o.w===x.w})[0]||{d:[]}).d)),
      mulberry32(idx+7));
    h+='<div class="wl" id="wq'+idx+'"><div>'
      +(x.type==='p'? ('【字音】'+x.w+'　'+x.t+'（　）') : ('【字形】'+x.s))
      +'</div><div class="row" style="margin-top:6px">';
    opts.forEach(function(op,j){
      h+='<button class="btn" style="flex:0 0 auto;min-width:64px;padding:7px 10px" '
       +'onclick="wans('+idx+',\''+op+'\',\''+x.a+'\')">'+op+'</button>';
    });
    h+='</div><em>答案：'+x.a+'　'+esc(x.n)+'</em></div>';
  });
  h+='</div><div class="row"><button class="btn" onclick="renderHome()">返回首页</button>'
   +(wr.length?'<button class="btn gh" onclick="clearWrong()">清空错题本</button>':'')+'</div>';
  document.getElementById('s-wrong').innerHTML=h;
  go('wrong');
}
function wans(i,sel,ans){
  var el=document.getElementById('wq'+i);
  el.style.background = (sel===ans)? '#e8f5ee':'#fdecec';
  if(sel===ans){var k=(Object.keys(S.wrong).filter(function(kk){
    return S.wrong[kk].a===ans}))[0]; if(k) delete S.wrong[k]; save();}
}
function clearWrong(){if(confirm('清空错题本？')){S.wrong={};save();openWrong()}}
function reseed(){S=newState();levelsCache=null;save();renderHome()}
function resetAll(){if(confirm('清空全部进度？')){S=newState(S.seed);
  levelsCache=null;save();renderHome()}}

document.addEventListener('DOMContentLoaded', renderHome);
</script>
</body>
</html>
